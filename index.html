<!DOCTYPE html>
<html lang="en" class="dark theme-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOVA">
    <title>NOVA by Aravind - iPadOS Native</title>

    <!-- Dynamic PWA Icon & Manifest -->
    <script>
        (function() {
            const svgData = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#1C1C1E'/><path d='M256 120l25 111 111 25-111 25-25 111-25-111-111-25 111-25z' fill='#0A84FF'/></svg>`;
            const svgUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgData);
            const iconLink = document.createElement('link');
            iconLink.rel = 'icon'; iconLink.type = 'image/svg+xml'; iconLink.href = svgUrl;
            document.head.appendChild(iconLink);

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                canvas.getContext('2d').drawImage(img, 0, 0);
                try {
                    const pngUrl = canvas.toDataURL('image/png');
                    const appleLink = document.createElement('link');
                    appleLink.rel = 'apple-touch-icon'; appleLink.href = pngUrl;
                    document.head.appendChild(appleLink);
                    
                    const manifest = {
                        name: "NOVA Studio", short_name: "NOVA", start_url: window.location.href.split('?')[0] || ".", display: "standalone",
                        background_color: "#000000", theme_color: "#000000",
                        icons: [{ src: pngUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
                    };
                    const manifestLink = document.createElement('link');
                    manifestLink.rel = 'manifest';
                    manifestLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
                    document.head.appendChild(manifestLink);
                } catch(e) {}
            };
            img.src = svgUrl;
        })();
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'], 
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'] 
                    },
                    colors: {
                        apple: {
                            blue: 'var(--sys-color)',
                            bg: '#000000',
                            border: 'rgba(255, 255, 255, 0.15)',
                            borderLight: 'rgba(255, 255, 255, 0.08)',
                            text: '#FFFFFF',
                            label: 'rgba(235, 235, 245, 0.6)'
                        }
                    },
                    boxShadow: {
                        'glass-card': '0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0.5px rgba(255, 255, 255, 0.15)',
                        'glass-modal': '0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0.5px rgba(255, 255, 255, 0.2)',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Apple Native Dynamic Colors */
            --sys-color: #0A84FF; --glow-1: #0A84FF; --glow-2: #5E5CE6; --glow-3: #32ADE6; 
            /* Apple UI Fluid Physics */
            --apple-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
            --apple-spring: cubic-bezier(0.32, 0.72, 0, 1);
            --apple-spring-bouncy: cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }
        .theme-blue { --sys-color: #0A84FF; --glow-1: #0A84FF; --glow-2: #5E5CE6; --glow-3: #32ADE6; }
        .theme-purple { --sys-color: #BF5AF2; --glow-1: #BF5AF2; --glow-2: #FF375F; --glow-3: #5E5CE6; }
        .theme-pink { --sys-color: #FF375F; --glow-1: #FF375F; --glow-2: #FF9F0A; --glow-3: #BF5AF2; }
        .theme-orange { --sys-color: #FF9F0A; --glow-1: #FF9F0A; --glow-2: #FF375F; --glow-3: #FFD60A; }

        /* Invisible Scrollbars for Native Feel */
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        body { background-color: #000; color: #FFF; overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }

        /* ===================================================================== */
        /* TRUE APPLE LIQUID GLASS ENGINE                                        */
        /* ===================================================================== */
        .liquid-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000; pointer-events: none; }
        
        .blob { 
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; 
            animation: float 20s var(--apple-ease) infinite alternate; 
            will-change: transform; mix-blend-mode: screen; transform-style: preserve-3d;
        }
        .blob-1 { background: var(--glow-1); width: 80vw; height: 80vw; top: -10%; left: -20%; }
        .blob-2 { background: var(--glow-2); width: 70vw; height: 70vw; bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: var(--glow-3); width: 60vw; height: 60vw; top: 10%; left: 30%; animation-delay: -10s; }
        
        @keyframes float {
            0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
            33% { transform: translate3d(10vw, 15vh, 0) scale(1.1) rotate(10deg); }
            66% { transform: translate3d(-10vw, 5vh, 0) scale(0.9) rotate(-5deg); }
            100% { transform: translate3d(5vw, -10vh, 0) scale(1.05) rotate(5deg); }
        }

        /* iPadOS Native Materials */
        .glass-panel {
            background: rgba(18, 18, 22, 0.5);
            backdrop-filter: blur(60px) saturate(250%);
            -webkit-backdrop-filter: blur(60px) saturate(250%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 30px 60px rgba(0, 0, 0, 0.6);
            border: none;
        }
        
        .glass-header {
            background: rgba(15, 15, 18, 0.45);
            backdrop-filter: blur(80px) saturate(250%);
            -webkit-backdrop-filter: blur(80px) saturate(250%);
            box-shadow: inset 0 -0.5px 0 rgba(255, 255, 255, 0.1);
        }

        /* View Transitions - Edge to Edge */
        .view-transition { transition: opacity 0.4s var(--apple-ease), transform 0.6s var(--apple-spring); transform-origin: center center; }
        .view-hidden { opacity: 0; transform: scale(0.94) translateY(20px); pointer-events: none; position: absolute; inset: 0; display: none; }
        .view-active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; position: absolute; inset: 0; display: flex; flex-direction: column; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-stagger { opacity: 0; animation: slideUp 0.7s var(--apple-spring) forwards; }

        /* ===================================================================== */
        /* XCODE ACCURATE EDITOR                                                 */
        /* ===================================================================== */
        .editor-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #161618; z-index: 10; }
        .editor-textarea, .editor-pre {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 1.5rem 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            font-size: 15px; line-height: 1.6; letter-spacing: 0.2px;
            white-space: pre; word-wrap: normal; overflow-wrap: normal; overflow: auto;
            tab-size: 2; margin: 0; border: none; outline: none;
        }
        .editor-textarea { color: transparent; background: transparent; caret-color: var(--sys-color); z-index: 2; resize: none; }
        .editor-textarea::selection { background-color: rgba(10, 132, 255, 0.35); color: transparent; border-radius: 4px; }
        .editor-pre { z-index: 1; pointer-events: none; color: #FFFFFF; }
        
        /* Authentic Xcode Dark Syntax Colors */
        .syn-keyword { color: #FF7AB2; font-weight: 500; text-shadow: 0 0 10px rgba(255,122,178,0.2); } 
        .syn-string { color: #FF8170; } 
        .syn-number { color: #D9C97C; }
        .syn-comment { color: #7F8C98; font-style: italic; } 
        .syn-function { color: #5DD8FF; font-weight: 500; text-shadow: 0 0 10px rgba(93,216,255,0.2); }
        .syn-tag { color: #5DD8FF; } 
        .syn-attr { color: #D9C97C; } 
        .syn-property { color: #5DD8FF; }

        /* ===================================================================== */
        /* NATIVE IOS CONTROLS                                                   */
        /* ===================================================================== */
        .ios-btn { cursor: pointer; transition: opacity 0.2s ease, transform 0.4s var(--apple-spring); user-select: none; -webkit-user-select: none; transform-origin: center; }
        .ios-btn:active { opacity: 0.6; transform: scale(0.9); transition: transform 0.1s ease; }
        
        .ios-card { 
            transition: transform 0.4s var(--apple-spring), box-shadow 0.4s var(--apple-ease), background 0.3s ease; 
            cursor: pointer; user-select: none; -webkit-user-select: none; 
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0,0,0,0.3);
        }
        .ios-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), inset 0 0 0 1px rgba(255,255,255,0.1), 0 25px 40px rgba(0,0,0,0.5);
            background: rgba(40, 40, 45, 0.5);
        }
        .ios-card:active { transform: scale(0.96) translateY(0); filter: brightness(0.9); transition: transform 0.1s ease; }
        
        /* True iOS Segmented Control */
        .segmented-control { background-color: rgba(118, 118, 128, 0.24); padding: 2px; border-radius: 9px; display: inline-flex; align-items: center; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }
        .segmented-btn { padding: 4px 18px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #EBEBF5; transition: all 0.3s var(--apple-spring); cursor: pointer; }
        .segmented-btn.active { background-color: #636366; color: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 3px 1px rgba(0,0,0,0.06); font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        /* Thin Apple Resizer */
        #resizer { 
            width: 24px; margin-left: -12px; margin-right: -12px; 
            cursor: col-resize; background: transparent; position: relative; z-index: 30; 
            display: flex; justify-content: center; align-items: center;
        }
        #resizer .resizer-line { width: 4px; height: 36px; background: rgba(255,255,255,0.15); border-radius: 4px; transition: all 0.3s var(--apple-spring); }
        #resizer:active .resizer-line, #resizer.dragging .resizer-line { background: var(--sys-color); width: 2px; height: 100%; box-shadow: 0 0 10px var(--sys-color); }
        
        /* Native UIAlertController Styling */
        .modal-backdrop { backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); background: rgba(0,0,0,0.6); transition: opacity 0.4s ease; }
        .ios-alert-box { 
            background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(60px) saturate(200%); -webkit-backdrop-filter: blur(60px) saturate(200%);
            border-radius: 18px; width: 280px; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.5s var(--apple-spring-bouncy), opacity 0.4s ease, filter 0.4s ease;
        }
        .modal-enter { transform: scale(1.15) translateY(20px); opacity: 0; filter: blur(5px); }
        .modal-active { transform: scale(1) translateY(0); opacity: 1; filter: blur(0px); }
        
        /* Drop Overlay */
        #drop-zone {
            position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--apple-ease);
        }
        #drop-zone.active { opacity: 1; pointer-events: auto; }
        
        /* Preview Viewport Sizing */
        .viewport-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: transparent; transition: padding 0.5s var(--apple-spring); }
        .viewport-mobile iframe { max-width: 375px; max-height: 812px; border-radius: 44px; border: 14px solid #050508; box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.1); transition: all 0.5s var(--apple-spring); }
        .viewport-tablet iframe { max-width: 820px; max-height: 1180px; border-radius: 28px; border: 14px solid #050508; box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.1); transition: all 0.5s var(--apple-spring); }
        .viewport-desktop iframe { max-width: 100%; max-height: 100%; border-radius: 0; border: none; transition: all 0.5s var(--apple-spring); }
        
        /* Indeterminate Linear Loader (iOS Style) */
        .loader-bar {
            height: 3px; background: var(--sys-color);
            width: 40%; position: absolute; top: 0; left: -40%; 
            animation: loadingSweep 1.2s var(--apple-ease) infinite; z-index: 50; display: none;
            box-shadow: 0 0 15px var(--sys-color); border-radius: 0 3px 3px 0;
        }
        @keyframes loadingSweep { 0% { left: -40%; width: 0%; } 50% { width: 40%; } 100% { left: 100%; width: 10%; } }

        /* Toast Pill */
        .toast-pill { transform: translateY(-150%) scale(0.9); opacity: 0; transition: all 0.5s var(--apple-spring-bouncy); }
        .toast-active { transform: translateY(0) scale(1); opacity: 1; }

        /* Files App Gradients */
        .proj-gradient-0 { background: linear-gradient(135deg, #0A84FF, #0055FF); }
        .proj-gradient-1 { background: linear-gradient(135deg, #5E5CE6, #3E3CA6); }
        .proj-gradient-2 { background: linear-gradient(135deg, #32ADE6, #227DA6); }
        .proj-gradient-3 { background: linear-gradient(135deg, #FF9F0A, #BF7707); }
        .proj-gradient-4 { background: linear-gradient(135deg, #FF375F, #BF2947); }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen font-sans selection:bg-apple-blue/40 pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)]">

    <!-- LIQUID MESH BACKGROUND -->
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- DRAG & DROP OVERLAY -->
    <div id="drop-zone">
        <div class="glass-panel border border-apple-border rounded-[2rem] p-10 md:p-14 flex flex-col items-center shadow-2xl transition-transform duration-300 scale-95" id="drop-box">
            <div class="w-20 h-20 rounded-full bg-apple-blue/20 flex items-center justify-center mb-6 shadow-[0_0_40px_var(--sys-color)]">
                <i data-lucide="cloud-download" class="w-10 h-10 text-apple-blue animate-bounce"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">Drop to Import</h2>
            <p class="text-apple-label font-medium text-[16px]">Files will be automatically added.</p>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (Edge-to-Edge) -->
    <div class="absolute inset-0 flex flex-col overflow-hidden bg-transparent">
        
        <!-- ========================================== -->
        <!-- VIEW 1: HOME DASHBOARD (Files App Style)   -->
        <!-- ========================================== -->
        <div id="home-view" class="view-transition view-active glass-panel z-20 absolute inset-0">
            
            <!-- Native Home Header -->
            <header class="h-[60px] flex-shrink-0 flex items-center justify-between px-5 md:px-8 z-40 glass-header relative">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-[10px] bg-apple-blue flex items-center justify-center shadow-[0_0_15px_var(--sys-color)] transition-transform duration-500">
                        <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
                    </div>
                    <span class="font-bold text-[22px] tracking-tight text-white">NOVA</span>
                </div>
                
                <!-- Right Controls (Theme & Profile) -->
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-3 bg-black/30 px-3 py-2 rounded-full border border-white/10 shadow-inner">
                        <button onclick="setTheme('blue')" class="w-4 h-4 rounded-full bg-[#0A84FF] ios-btn ring-2 ring-offset-2 ring-offset-transparent focus:ring-[#0A84FF]/60 shadow-[0_0_10px_#0A84FF]"></button>
                        <button onclick="setTheme('purple')" class="w-4 h-4 rounded-full bg-[#BF5AF2] ios-btn ring-2 ring-offset-2 ring-offset-transparent focus:ring-[#BF5AF2]/60 shadow-[0_0_10px_#BF5AF2]"></button>
                        <button onclick="setTheme('pink')" class="w-4 h-4 rounded-full bg-[#FF375F] ios-btn ring-2 ring-offset-2 ring-offset-transparent focus:ring-[#FF375F]/60 shadow-[0_0_10px_#FF375F]"></button>
                        <button onclick="setTheme('orange')" class="w-4 h-4 rounded-full bg-[#FF9F0A] ios-btn ring-2 ring-offset-2 ring-offset-transparent focus:ring-[#FF9F0A]/60 shadow-[0_0_10px_#FF9F0A]"></button>
                    </div>
                    <!-- Developer Profile Icon -->
                    <div class="h-9 w-9 rounded-full bg-gradient-to-b from-[#3A3A3C] to-[#1C1C1E] border border-white/20 flex items-center justify-center shadow-[0_5px_15px_rgba(0,0,0,0.5)] ios-btn cursor-default" title="Developed by Aravind">
                        <span class="text-white font-extrabold text-[12px] tracking-wider text-shadow-sm">AR</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="flex-1 overflow-y-auto touch-pan-y px-6 py-6 md:px-12 md:py-10 relative bg-transparent">
                <div class="max-w-6xl mx-auto">
                    
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-5 animate-stagger" style="animation-delay: 0.1s">
                        <div>
                            <!-- iOS Large Title -->
                            <h1 class="text-[34px] md:text-[44px] font-extrabold text-white tracking-tight leading-tight mb-2">Workspaces</h1>
                            <p class="text-apple-label text-[15px] md:text-[17px] font-medium">Manage and launch your local projects.</p>
                            <!-- Aravind Badge -->
                            <div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 backdrop-blur-md cursor-default">
                                <i data-lucide="code-2" class="w-4 h-4 text-apple-blue"></i>
                                <span class="text-[13px] font-medium text-apple-label">Developed by <span class="text-white font-semibold tracking-wide uppercase">Aravind</span></span>
                            </div>
                        </div>
                        <button onclick="Workspace.createProject()" class="ios-btn bg-apple-blue text-white px-6 py-3 rounded-xl font-semibold text-[15px] flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(10,132,255,0.4)] w-full sm:w-auto">
                            <i data-lucide="plus" class="w-5 h-5"></i> New Workspace
                        </button>
                    </div>

                    <!-- iOS Style Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="home-project-grid">
                        <!-- Populated by JS -->
                    </div>

                </div>
            </div>
        </div>


        <!-- ========================================== -->
        <!-- VIEW 2: IDE WORKSPACE                      -->
        <!-- ========================================== -->
        <div id="ide-view" class="view-transition view-hidden z-30 absolute inset-0 flex flex-col bg-transparent">
            
            <!-- Native iOS Navigation Bar -->
            <header class="h-[52px] md:h-[56px] flex-shrink-0 flex items-center justify-between px-2 md:px-4 z-40 glass-header relative">
                <!-- Left Section -->
                <div class="flex items-center gap-1 md:gap-2 w-auto lg:w-1/3 min-w-0">
                    <button onclick="UI.switchView('home')" class="ios-btn p-2 text-apple-blue flex items-center gap-0.5">
                        <i data-lucide="chevron-left" class="w-7 h-7 -ml-1.5"></i>
                        <span class="hidden md:block text-[17px] font-medium">Workspaces</span>
                    </button>

                    <button onclick="UI.toggleMobileSidebar()" class="md:hidden ios-btn p-2 text-apple-blue"><i data-lucide="sidebar" class="w-6 h-6"></i></button>
                    <button onclick="UI.toggleDesktopSidebar()" class="hidden md:block ios-btn p-2 text-apple-blue ml-2" title="Toggle Sidebar"><i data-lucide="sidebar" class="w-5 h-5"></i></button>
                    
                    <div class="flex items-center min-w-0 px-2">
                        <span id="ide-project-title" class="text-[17px] font-semibold text-white truncate max-w-[130px] md:max-w-[200px]">Loading...</span>
                    </div>
                </div>
                
                <!-- Native Segmented Control -->
                <div class="hidden md:flex justify-center w-1/3 flex-shrink-0">
                    <div class="segmented-control">
                        <button onclick="UI.setViewMode('editor')" id="btn-view-editor" class="segmented-btn active ios-btn">Code</button>
                        <button onclick="UI.setViewMode('split')" id="btn-view-split" class="segmented-btn ios-btn">Split</button>
                        <button onclick="UI.setViewMode('preview')" id="btn-view-preview" class="segmented-btn ios-btn">Preview</button>
                    </div>
                </div>
                
                <!-- Right Controls -->
                <div class="flex items-center justify-end gap-3 w-auto lg:w-1/3 flex-shrink-0 pr-2">
                    <div class="flex items-center gap-4">
                        <label class="hidden sm:flex items-center gap-1.5 text-[15px] text-apple-blue ios-btn cursor-pointer">
                            <input type="checkbox" id="auto-run-toggle" checked class="accent-apple-blue w-4 h-4"> Live
                        </label>
                        <button id="run-btn" disabled class="ios-btn flex items-center gap-1.5 text-[16px] font-semibold text-apple-blue opacity-50 cursor-not-allowed">
                            <i data-lucide="play-circle" class="w-5 h-5 fill-current"></i> <span class="hidden sm:block">Run</span>
                        </button>
                    </div>
                    <button onclick="UI.toggleMobileView()" class="md:hidden ios-btn p-2 text-apple-blue"><i data-lucide="arrow-left-right" class="w-5 h-5"></i></button>
                </div>
            </header>

            <!-- Main Workspace Area -->
            <main class="flex-1 flex overflow-hidden relative z-10 bg-transparent">
                
                <!-- Sidebar (Native Material List) -->
                <aside id="sidebar" class="absolute md:relative w-[280px] md:w-[260px] h-full flex-shrink-0 flex flex-col glass-panel border-r border-apple-border z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-400 ease-[cubic-bezier(0.25,0.1,0.25,1)]">
                    <div class="px-5 pt-5 pb-2 flex justify-between items-center border-b border-white/5">

    <!-- Notification Pill -->

        <div id="toast" class="bg-[rgba(30,30,35,0.85)] backdrop-blur-3xl border border-white/10 px-4 py-2.5 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.8)] flex items-center gap-2.5 toast-pill">
            <div id="toast-icon-wrap" class="bg-apple-blue/20 p-1.5 rounded-full"><i id="toast-icon" data-lucide="check" class="w-4 h-4 text-apple-blue"></i></div>
            <span id="toast-message" class="text-[14px] font-medium text-white tracking-tight">Success</span>

    <script>
        // --- RELATIVE TIME HELPER ---
        function timeAgo(dateParam) {
            if (!dateParam) return null;
            const date = typeof dateParam === 'object' ? dateParam : new Date(dateParam);
            const seconds = Math.round((new Date() - date) / 1000);
            const minutes = Math.round(seconds / 60);
            const hours = Math.round(minutes / 60);
            const days = Math.round(hours / 24);

            if (seconds < 30) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        // --- XCODE SYNTAX HIGHLIGHTER ---
        const Highlighter = {
            highlight: (code, lang) => {
                if (!code) return '';
                let html = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                if (lang === 'html') {
                    html = html.replace(/(&lt;\/?)([a-zA-Z0-9-]+)(\s|&gt;)/g, '$1<span class="syn-tag">$2</span>$3');
                    html = html.replace(/([a-zA-Z-]+)=/g, '<span class="syn-attr">$1</span>=');
                    html = html.replace(/(&quot;.*?&quot;)/g, '<span class="syn-string">$1</span>');
                    html = html.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="syn-comment">$1</span>');
                } else if (lang === 'css') {
                    html = html.replace(/([a-zA-Z-]+)\s*:/g, '<span class="syn-property">$1</span>:');
                    html = html.replace(/:(.*?);/g, ':<span class="syn-string">$1</span>;');
                    html = html.replace(/([\.#@][a-zA-Z0-9_-]+)/g, '<span class="syn-tag">$1</span>');
                    html = html.replace(/\/\*[\s\S]*?\*\//g, match => `<span class="syn-comment">${match}</span>`);
                } else if (lang === 'javascript' || lang === 'js') {
                    const keywords = /\b(const|let|var|function|return|if|else|for|while|class|import|export|from|new|true|false|null|undefined|async|await|try|catch|window|document)\b/g;
                    html = html.replace(keywords, '<span class="syn-keyword">$1</span>');
                    html = html.replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g, '<span class="syn-string">$1</span>');
                    html = html.replace(/\b([0-9]+)\b/g, '<span class="syn-number">$1</span>');
                    html = html.replace(/([a-zA-Z0-9_]+)\s*\(/g, '<span class="syn-function">$1</span>(');
                    html = html.replace(/(\/\/.*|\/\*[\s\S]*?\*\/)/g, match => `<span class="syn-comment">${match}</span>`);
                } else if (lang === 'json') {
                    html = html.replace(/(&quot;.*?&quot;)\s*:/g, '<span class="syn-property">$1</span>:');
                    html = html.replace(/:\s*(&quot;.*?&quot;)/g, ': <span class="syn-string">$1</span>');
                    html = html.replace(/:\s*([0-9\.]+)/g, ': <span class="syn-number">$1</span>');
                    html = html.replace(/:\s*(true|false|null)/g, ': <span class="syn-keyword">$1</span>');
                }
                return html;
            }
        };

        // --- NATIVE iOS DIALOGS ---
        const Dialog = {
            els: {
                overlay: document.getElementById('dialog-overlay'), box: document.getElementById('dialog-box'),
                title: document.getElementById('dialog-title'), msg: document.getElementById('dialog-message'),
                input: document.getElementById('dialog-input'), cancel: document.getElementById('dialog-cancel'), confirm: document.getElementById('dialog-confirm')
            },
            show: (type, title, message, defaultVal = '') => new Promise((resolve) => {
                Dialog.els.title.innerText = title; Dialog.els.msg.innerText = message;
                if (type === 'prompt') { Dialog.els.input.classList.remove('hidden'); Dialog.els.input.value = defaultVal; } 
                else { Dialog.els.input.classList.add('hidden'); }
                Dialog.els.cancel.style.display = type === 'alert' ? 'none' : 'block';

                const cleanup = () => {
                    Dialog.els.overlay.classList.add('opacity-0'); 
                    Dialog.els.box.classList.replace('modal-active', 'modal-enter');
                    setTimeout(() => Dialog.els.overlay.classList.add('hidden'), 300);
                };
                const finish = (val) => { cleanup(); resolve(val); };

                Dialog.els.confirm.onclick = () => finish(type === 'prompt' ? Dialog.els.input.value : true);
                Dialog.els.cancel.onclick = () => finish(type === 'prompt' ? null : false);
                Dialog.els.input.onkeydown = (e) => { if (e.key === 'Enter') Dialog.els.confirm.click(); if (e.key === 'Escape') Dialog.els.cancel.click(); };

                Dialog.els.overlay.classList.remove('hidden');
                requestAnimationFrame(() => {
                    Dialog.els.overlay.classList.remove('opacity-0'); 
                    Dialog.els.box.classList.replace('modal-enter', 'modal-active');
                    if (type === 'prompt') Dialog.els.input.focus();
                });
            }),
            alert: (title, msg) => Dialog.show('alert', title, msg),
            confirm: (title, msg) => Dialog.show('confirm', title, msg),
            prompt: (title, msg, def) => Dialog.show('prompt', title, msg, def)
        };

        // --- TEMPLATES ---
        const Templates = {
            apple: [
                { id: '1', name: 'index.html', language: 'html', content: `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n  <title>App</title>\n</head>\n<body>\n  <div class="view">\n    <div class="icon"></div>\n    <h1>NOVA by Aravind</h1>\n    <p>A flagship browser-based development environment.</p>\n    <button onclick="runTest()">Initialize System</button>\n  </div>\n</body>\n</html>` },
                { id: '2', name: 'style.css', language: 'css', content: `body {\n  background: #000000; color: #FFFFFF;\n  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;\n  display: flex; justify-content: center; align-items: center;\n  min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased;\n}\n.view {\n  background: #1C1C1E; padding: 40px; border-radius: 24px;\n  text-align: center; max-width: 320px; width: 100%;\n}\n.icon {\n  font-size: 56px; margin-bottom: 16px; color: #0A84FF;\n}\nh1 {\n  font-size: 26px; font-weight: 700; margin: 0 0 8px;\n  letter-spacing: 0.36px;\n}\np {\n  color: rgba(235, 235, 245, 0.6); font-size: 15px;\n  line-height: 20px; margin-bottom: 32px;\n}\nbutton {\n  background: #0A84FF; color: #FFFFFF; border: none;\n  padding: 14px 20px; border-radius: 14px; font-size: 17px;\n  font-weight: 600; width: 100%; cursor: pointer;\n}\nbutton:active { opacity: 0.7; }` },
                { id: '3', name: 'main.js', language: 'javascript', content: `console.info('Application crafted by Aravind loaded.');\n\nfunction runTest() {\n  const payload = { developer: "Aravind", os: "iPadOS 18", blur: "Active", haptic: true };\n  console.log("System initialized.");\n  console.warn("Telemetry Data:", payload);\n}` }
            ]
        };

        // --- APP STATE ---
        const State = {
            projects: {}, currentProjId: null, files: [], activeFileId: null,
            autoRun: true, consoleLogs: [], runTimer: null, blobUrl: null, theme: 'blue',
            viewport: 'desktop', mobileViewMode: 'editor', currentView: 'home' 
        };

        const Els = {
            homeView: document.getElementById('home-view'), ideView: document.getElementById('ide-view'),
            fileList: document.getElementById('file-list'), tabs: document.getElementById('editor-tabs'),
            editor: document.getElementById('code-editor'), pre: document.getElementById('editor-pre'), codePre: document.querySelector('#editor-pre code'),
            lines: document.getElementById('line-numbers'), iframe: document.getElementById('preview-frame'),
            consoleOut: document.getElementById('console-output'), loader: document.getElementById('loader'),
            runBtn: document.getElementById('run-btn'), ideProjTitle: document.getElementById('ide-project-title'),
            sidebar: document.getElementById('sidebar'), vpContainer: document.getElementById('viewport-container')
        };

        // --- VIEWPORT MANAGER ---
        const Preview = {
            setViewport: (mode) => {
                State.viewport = mode;
                Els.vpContainer.className = `viewport-container viewport-${mode}`;
                ['vp-mobile', 'vp-tablet', 'vp-desktop'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.className = `ios-btn p-1.5 rounded-lg text-apple-label bg-white/5 hover:bg-white/10 ${id==='vp-desktop'?'hidden sm:block':''}`;
                });
                const active = document.getElementById(`vp-${mode}`);
                if(active) active.className = `ios-btn p-1.5 rounded-lg text-apple-blue bg-apple-blue/20 border border-apple-blue/30 shadow-sm ${mode==='desktop'?'hidden sm:block':''}`;
            }
        };

        // --- UI CONTROLLER ---
        const UI = {
            init: () => {
                lucide.createIcons();
                UI.setupEditor(); UI.setupSplitter(); UI.setupShortcuts(); UI.setupDragAndDrop();
                
                document.getElementById('auto-run-toggle').addEventListener('change', (e) => {
                    State.autoRun = e.target.checked; 
                    UI.updateRunButtonState();
                    if(State.autoRun) Engine.run();
                });
                
                if (window.innerWidth < 768) UI.setViewMode('editor');
            },

            updateRunButtonState: () => {
                if (State.autoRun) {
                    Els.runBtn.disabled = true;
                    Els.runBtn.classList.remove('run-pulse');
                    Els.runBtn.className = "ios-btn flex items-center gap-1.5 text-[15px] font-semibold text-apple-blue opacity-50 cursor-not-allowed transition-all";
                } else {
                    Els.runBtn.disabled = false;
                    Els.runBtn.className = "ios-btn flex items-center gap-1.5 text-[15px] font-semibold text-apple-blue hover:scale-105 run-pulse transition-all";
                }
            },
            
            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = msg;
                const icon = document.getElementById('toast-icon');
                const wrap = document.getElementById('toast-icon-wrap');
                
                if (type === 'error') {
                    icon.setAttribute('data-lucide', 'alert-circle');
                    icon.className = 'w-4 h-4 text-[#FF3B30]';
                    wrap.className = 'bg-[#FF3B30]/20 p-1 rounded-full';
                } else {
                    icon.setAttribute('data-lucide', 'check-circle-2');
                    icon.className = 'w-4 h-4 text-apple-blue';
                    wrap.className = 'bg-apple-blue/20 p-1 rounded-full';
                }
                lucide.createIcons();
                
                toast.classList.add('toast-active');
                setTimeout(() => toast.classList.remove('toast-active'), 2500);
            },

            switchView: (viewName) => {
                State.currentView = viewName;
                if (viewName === 'home') {
                    Els.ideView.classList.replace('view-active', 'view-hidden');
                    Els.homeView.classList.replace('view-hidden', 'view-active');
                    Workspace.renderHomeGrid();
                } else if (viewName === 'ide') {
                    Els.homeView.classList.replace('view-active', 'view-hidden');
                    Els.ideView.classList.replace('view-hidden', 'view-active');
                    Workspace.loadActive();
                }
            },

            render: () => {
                UI.renderFiles(); UI.renderTabs();
                const active = State.files.find(f => f.id === State.activeFileId);
                if (active) {
                    if (Els.editor.value !== active.content) Els.editor.value = active.content;
                    Els.codePre.innerHTML = Highlighter.highlight(active.content, active.language);
                } else { Els.editor.value = ''; Els.codePre.innerHTML = ''; }
                UI.updateLines(); lucide.createIcons();
            },

            getIcon: (name) => {
                if (name.endsWith('.html')) return '<i data-lucide="file-code-2" class="w-4 h-4 md:w-5 md:h-5 text-[#FF7AB2]"></i>';
                if (name.endsWith('.css')) return '<i data-lucide="file-json" class="w-4 h-4 md:w-5 md:h-5 text-[#5DD8FF]"></i>';
                if (name.endsWith('.js')) return '<i data-lucide="braces" class="w-4 h-4 md:w-5 md:h-5 text-[#D9C97C]"></i>';
                if (name.endsWith('.json')) return '<i data-lucide="database" class="w-4 h-4 md:w-5 md:h-5 text-[#FFD60A]"></i>';
                return '<i data-lucide="file-text" class="w-4 h-4 md:w-5 md:h-5 text-apple-label"></i>';
            },

            renderFiles: () => {
                Els.fileList.innerHTML = State.files.map(f => `
                    <div onclick="Workspace.setActive('${f.id}'); window.innerWidth < 768 ? UI.toggleMobileSidebar() : null" class="ios-card flex items-center px-3 py-3 cursor-pointer group rounded-xl mb-1 transition-all duration-300 ${State.activeFileId === f.id ? 'bg-white/15 text-white shadow-inner border border-white/10' : 'text-apple-label hover:bg-white/10 border border-transparent'}">
                        <div class="mr-3 opacity-100 flex-shrink-0">${UI.getIcon(f.name)}</div>
                        <span class="text-[15px] font-semibold flex-1 truncate tracking-wide">${f.name}</span>
                    </div>
                `).join('');
            },

            renderTabs: () => {
                Els.tabs.innerHTML = State.files.map(f => `
                    <div onclick="Workspace.setActive('${f.id}')" class="flex items-center h-full px-4 cursor-pointer rounded-t-xl transition-colors border-r border-white/5 min-w-[120px] max-w-[180px] flex-shrink-0 ${State.activeFileId === f.id ? 'bg-[#161618] text-white border-t border-white/10' : 'text-apple-label hover:bg-black/20'}">
                        <span class="mr-2 opacity-90 flex-shrink-0">${UI.getIcon(f.name)}</span>
                        <span class="text-[13px] font-semibold truncate flex-1 min-w-0" ondblclick="Workspace.renameFile(event, '${f.id}')">${f.name}</span>
                        <button onclick="Workspace.deleteFile(event, '${f.id}')" class="ml-2 opacity-0 hover:opacity-100 hover:text-[#FF3B30] ios-btn p-1 flex-shrink-0 ${State.activeFileId === f.id ? 'opacity-60' : ''}"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                `).join('');
            },

            updateLines: () => {
                const lines = Els.editor.value.split('\n').length;
                Els.lines.innerHTML = Array.from({ length: lines || 1 }).map((_, i) => `<div>${i + 1}</div>`).join('');
            },

            setupEditor: () => {
                Els.editor.addEventListener('input', (e) => {
                    const f = State.files.find(x => x.id === State.activeFileId);
                    if(f) {
                        f.content = e.target.value;
                        Els.codePre.innerHTML = Highlighter.highlight(f.content, f.language);
                        UI.updateLines(); Workspace.save();
                        
                        if (State.autoRun) { 
                            clearTimeout(State.runTimer); if(Els.loader) Els.loader.style.display = 'block'; 
                            State.runTimer = setTimeout(Engine.run, 800); 
                        } else {
                            Els.runBtn.classList.add('run-pulse');
                        }
                    }
                });

                Els.editor.addEventListener('scroll', () => { 
                    Els.lines.scrollTop = Els.editor.scrollTop; 
                    Els.pre.scrollTop = Els.editor.scrollTop; Els.pre.scrollLeft = Els.editor.scrollLeft;
                });

                Els.editor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault(); const s = Els.editor.selectionStart;
                        Els.editor.value = Els.editor.value.substring(0, s) + "  " + Els.editor.value.substring(Els.editor.selectionEnd);
                        Els.editor.selectionStart = Els.editor.selectionEnd = s + 2;
                        Els.editor.dispatchEvent(new Event('input'));
                    }
                    const p = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };
                    if (p[e.key]) {
                        e.preventDefault(); const s = Els.editor.selectionStart;
                        Els.editor.value = Els.editor.value.substring(0, s) + e.key + p[e.key] + Els.editor.value.substring(Els.editor.selectionEnd);
                        Els.editor.selectionStart = Els.editor.selectionEnd = s + 1;
                        Els.editor.dispatchEvent(new Event('input'));
                    }
                });
            },

            setupSplitter: () => {
                let drag = false; const resizer = document.getElementById('resizer');
                const es = document.getElementById('editor-section'); const ps = document.getElementById('preview-section');
                
                const startDrag = () => { drag = true; resizer.classList.add('dragging'); document.body.style.cursor = 'col-resize'; Els.iframe.style.pointerEvents = 'none'; };
                const onDrag = (e) => {
                    if (!drag) return;
                    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const w = document.getElementById('workspace-container').getBoundingClientRect();
                    let nw = ((clientX - w.left) / w.width) * 100;
                    if (nw < 20) nw = 20; if (nw > 80) nw = 80;
                    es.style.width = `${nw}%`; ps.style.width = `${100 - nw}%`;
                };
                const stopDrag = () => { if (drag) { drag = false; resizer.classList.remove('dragging'); document.body.style.cursor = 'default'; Els.iframe.style.pointerEvents = 'auto'; } };

                resizer.addEventListener('mousedown', startDrag); resizer.addEventListener('touchstart', startDrag, {passive: true});
                document.addEventListener('mousemove', onDrag); document.addEventListener('touchmove', (e) => { if(drag) { e.preventDefault(); onDrag(e); } }, {passive: false});
                document.addEventListener('mouseup', stopDrag); document.addEventListener('touchend', stopDrag);
            },

            setupDragAndDrop: () => {
                const zone = document.getElementById('drop-zone');
                const box = document.getElementById('drop-box');
                window.addEventListener('dragover', (e) => { 
                    e.preventDefault(); 
                    zone.classList.replace('opacity-0', 'opacity-100'); 
                    zone.classList.replace('pointer-events-none', 'pointer-events-auto');
                    box.classList.replace('scale-95', 'scale-100');
                });
                window.addEventListener('dragleave', (e) => { 
                    if(e.target === zone) {
                        zone.classList.replace('opacity-100', 'opacity-0'); 
                        zone.classList.replace('pointer-events-auto', 'pointer-events-none');
                        box.classList.replace('scale-100', 'scale-95');
                    }
                });
                window.addEventListener('drop', (e) => {
                    e.preventDefault(); 
                    zone.classList.replace('opacity-100', 'opacity-0'); 
                    zone.classList.replace('pointer-events-auto', 'pointer-events-none');
                    box.classList.replace('scale-100', 'scale-95');
                    
                    if (e.dataTransfer.files.length > 0) {
                        const creatingNew = State.currentView === 'home';
                        let newProjId = null;
                        
                        if (creatingNew) {
                            newProjId = 'proj_' + Date.now();
                            State.projects[newProjId] = { id: newProjId, name: 'Imported Workspace', files: [], updated: Date.now() };
                        }

                        Array.from(e.dataTransfer.files).forEach(file => {
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                if (creatingNew) { Workspace.importFileTo(file.name, ev.target.result, newProjId); } 
                                else { Workspace.importFile(file.name, ev.target.result); }
                            };
                            reader.readAsText(file);
                        });

                        if (creatingNew) { setTimeout(() => { Workspace.openProj(newProjId); UI.showToast("Project Imported"); }, 100); }
                    }
                });
            },

            setupShortcuts: () => {
                window.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); Engine.run(); UI.showToast("Saved & Built"); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); UI.toggleDesktopSidebar(); }
                });
            },

            setViewMode: (m) => {
                ['btn-view-editor', 'btn-view-split', 'btn-view-preview'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) { el.classList.remove('active'); }
                });
                const activeBtn = document.getElementById(`btn-view-${m}`);
                if(activeBtn) { activeBtn.classList.add('active'); }
                
                const es = document.getElementById('editor-section'); const ps = document.getElementById('preview-section'); const r = document.getElementById('resizer');
                
                if (window.innerWidth < 768) {
                    es.style.display = (m === 'editor') ? 'flex' : 'none';
                    ps.style.display = (m === 'preview') ? 'flex' : 'none';
                    if(m === 'split') { UI.showToast("Rotate device for split view","error"); return; }
                    es.style.width = '100%'; ps.style.width = '100%'; r.style.display = 'none';
                    State.mobileViewMode = m;
                } else {
                    es.style.display = (m === 'split' || m === 'editor') ? 'flex' : 'none';
                    ps.style.display = (m === 'split' || m === 'preview') ? 'flex' : 'none';
                    r.style.display = m === 'split' ? 'flex' : 'none';
                    if(m === 'split') { es.style.width = '50%'; ps.style.width = '50%'; } else { es.style.width = '100%'; ps.style.width = '100%'; }
                }
            },

            toggleMobileView: () => {
                const nextMode = State.mobileViewMode === 'editor' ? 'preview' : 'editor';
                UI.setViewMode(nextMode);
            },

            toggleMobileSidebar: () => {
                const s = Els.sidebar; const o = document.getElementById('sidebar-overlay');
                if (s.classList.contains('-translate-x-full')) {
                    s.classList.remove('-translate-x-full'); o.classList.remove('hidden'); requestAnimationFrame(()=>o.classList.remove('opacity-0'));
                } else {
                    s.classList.add('-translate-x-full'); o.classList.add('opacity-0'); setTimeout(()=>o.classList.add('hidden'), 300);
                }
            },

            toggleDesktopSidebar: () => {
                if(window.innerWidth < 768) return;
                const isHidden = Els.sidebar.style.display === 'none';
                Els.sidebar.style.display = isHidden ? 'flex' : 'none';
            }
        };

        // --- DATA LAYER ---
        const Workspace = {
            init: () => {
                try {
                    const s = localStorage.getItem('nova_aravind_master_v4');
                    if (s) { State.projects = JSON.parse(s); State.currentProjId = localStorage.getItem('nova_aravind_proj_master_v4') || Object.keys(State.projects)[0]; }
                } catch (e) {}

                if (!State.projects || Object.keys(State.projects).length === 0) {
                    const id = 'proj_' + Date.now();
                    State.projects = { [id]: { id, name: 'NOVA App', files: Templates.apple, updated: Date.now() } };
                    State.currentProjId = id; Workspace.save();
                }
                
                // Boot to Home screen
                UI.switchView('home');
            },

            save: () => {
                try {
                    if (State.currentProjId && State.projects[State.currentProjId] && State.currentView === 'ide') {
                        State.projects[State.currentProjId].files = State.files;
                        State.projects[State.currentProjId].updated = Date.now();
                    }
                    localStorage.setItem('nova_aravind_master_v4', JSON.stringify(State.projects));
                    localStorage.setItem('nova_aravind_proj_master_v4', State.currentProjId);
                } catch (e) { console.error(e); }
            },

            loadActive: () => {
                const p = State.projects[State.currentProjId];
                if (!p) return;
                State.files = p.files || []; State.activeFileId = State.files.length > 0 ? State.files[0].id : null;
                Els.ideProjTitle.innerText = p.name;
                UI.render(); Engine.run();
            },

            setActive: (id) => { State.activeFileId = id; UI.render(); },

            createFile: async () => {
                const name = await Dialog.prompt("New File", "Enter a name for the new file:", "script.js");
                if (name && name.trim()) {
                    const ext = name.split('.').pop().toLowerCase();
                    const f = { id: Date.now().toString(), name: name.trim(), language: ext === 'js' ? 'javascript' : ext, content: '' };
                    State.files.push(f); State.activeFileId = f.id; Workspace.save(); UI.render();
                }
            },

            importFile: (name, content) => { Workspace.importFileTo(name, content, State.currentProjId); },

            importFileTo: (name, content, targetProjId) => {
                const ext = name.split('.').pop().toLowerCase();
                const validExts = ['html', 'css', 'js', 'json', 'txt'];
                if(!validExts.includes(ext)) return UI.showToast(`Unsupported file type: .${ext}`, "error");

                const targetProj = State.projects[targetProjId];
                if(!targetProj) return;

                let existing = targetProj.files.find(f => f.name === name);
                if (existing) {
                    existing.content = content; 
                    if(State.currentView === 'ide' && State.currentProjId === targetProjId) State.activeFileId = existing.id;
                } else {
                    const f = { id: Date.now().toString() + Math.random(), name: name, language: ext === 'js' ? 'javascript' : ext, content: content };
                    targetProj.files.push(f);
                    if(State.currentView === 'ide' && State.currentProjId === targetProjId) State.activeFileId = f.id;
                }
                
                targetProj.updated = Date.now();
                Workspace.save(); 
                
                if (State.currentView === 'ide' && State.currentProjId === targetProjId) {
                    UI.render(); UI.showToast(`${name} imported`);
                    if(State.autoRun) Engine.run();
                }
            },

            renameFile: async (e, id) => {
                e.stopPropagation(); const f = State.files.find(x => x.id === id);
                const name = await Dialog.prompt("Rename File", "Enter a new name for this file:", f.name);
                if (name && name.trim()) { 
                    f.name = name.trim(); 
                    f.language = f.name.split('.').pop().toLowerCase() === 'js' ? 'javascript' : f.name.split('.').pop().toLowerCase();
                    Workspace.save(); UI.render(); 
                }
            },

            deleteFile: async (e, id) => {
                e.stopPropagation();
                if (State.files.length <= 1) return Dialog.alert("Action Not Allowed", "You cannot delete the last file in the workspace.");
                const f = State.files.find(x => x.id === id);
                if (await Dialog.confirm("Delete File", `Are you sure you want to delete "${f.name}"?`)) {
                    State.files = State.files.filter(x => x.id !== id);
                    if (State.activeFileId === id) State.activeFileId = State.files[0].id;
                    Workspace.save(); UI.render();
                }
            },

            renderHomeGrid: () => {
                const sorted = Object.values(State.projects).sort((a,b) => b.updated - a.updated);
                const grid = document.getElementById('home-project-grid');
                
                grid.innerHTML = sorted.map((p, index) => {
                    const gradClass = `proj-gradient-${index % 5}`;
                    const timeString = timeAgo(p.updated);
                    const delay = index * 0.05; 
                    
                    return `
                    <div class="ios-card animate-stagger bg-[rgba(30,30,35,0.4)] rounded-[24px] overflow-hidden shadow-[0_15px_35px_rgba(0,0,0,0.5)] flex flex-col h-[220px] border border-white/10" style="animation-delay: ${delay}s" onclick="Workspace.openProj('${p.id}')">
                        <div class="h-[90px] ${gradClass} relative flex items-center justify-start px-6 border-b border-white/10">
                            <div class="w-14 h-14 bg-apple-blue rounded-[14px] flex items-center justify-center text-white shadow-md">
                                <i data-lucide="layout" class="w-7 h-7"></i>
                            </div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div class="min-w-0">
                                <h3 class="text-white text-[18px] font-bold truncate mb-1">${p.name}</h3>
                                <p class="text-[13px] text-apple-label font-medium truncate">${p.files.length} items • Edited ${timeString}</p>
                            </div>
                            <div class="flex items-center justify-end gap-2 mt-2 opacity-0 hover:opacity-100 transition-opacity duration-300" style="opacity: 0.9">
                                <button onclick="event.stopPropagation(); Workspace.renameProj('${p.id}')" class="ios-btn p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white shadow-sm" title="Rename"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); Workspace.exportHomeProj('${p.id}')" class="ios-btn p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white shadow-sm" title="Export"><i data-lucide="download" class="w-4 h-4"></i></button>
                                <button onclick="event.stopPropagation(); Workspace.deleteProj('${p.id}')" class="ios-btn p-2.5 rounded-full bg-red-500/20 hover:bg-red-500/40 text-[#FF3B30] shadow-sm" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                
                if(sorted.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 animate-stagger"><i data-lucide="layers" class="w-16 h-16 text-white/20 mx-auto mb-4"></i><h3 class="text-xl font-bold text-white mb-2">No Workspaces</h3><p class="text-apple-label">Create a new workspace or drop files to get started.</p></div>`;
                }
                lucide.createIcons();
            },

            createProject: async () => {
                const name = await Dialog.prompt("New Workspace", "Enter a name for the workspace:", "Untitled App");
                if(name) {
                    const id = 'proj_' + Date.now();
                    State.projects[id] = { id, name: name.trim(), files: [{id:'1',name:'index.html',language:'html',content:'<h1>New App by Aravind</h1>'}], updated: Date.now() };
                    Workspace.save(); Workspace.openProj(id); UI.showToast("Created");
                }
            },

            openProj: (id) => {
                State.currentProjId = id;
                Workspace.save(); 
                UI.switchView('ide');
            },

            renameProj: async (id) => {
                const name = await Dialog.prompt("Rename Workspace", "Enter a new name:", State.projects[id].name);
                if (name && name.trim()) { 
                    State.projects[id].name = name.trim(); Workspace.save(); Workspace.renderHomeGrid(); 
                    if(State.currentProjId === id) Els.ideProjTitle.innerText = name.trim(); 
                }
            },

            deleteProj: async (id) => {
                if (Object.keys(State.projects).length <= 1) return Dialog.alert("Action Not Allowed", "You must have at least one workspace.");
                if (await Dialog.confirm("Delete Workspace", `Delete "${State.projects[id].name}" permanently?`)) {
                    delete State.projects[id];
                    if (State.currentProjId === id) { State.currentProjId = Object.keys(State.projects)[0]; }
                    Workspace.save(); Workspace.renderHomeGrid(); UI.showToast("Deleted");
                }
            },
            
            copyContent: async () => { try { await navigator.clipboard.writeText(Els.editor.value); UI.showToast("Copied code"); } catch(e){ UI.showToast("Copy failed", "error"); } },

            downloadCurrentFile: () => {
                const f = State.files.find(x => x.id === State.activeFileId);
                if(!f) return;
                const blob = new Blob([f.content], { type: 'text/plain' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = f.name; a.click(); URL.revokeObjectURL(a.href);
                UI.showToast("File Downloaded");
            },
            
            exportHomeProj: (id) => {
                const p = State.projects[id];
                const html = p.files.find(f => f.name === 'index.html')?.content || '';
                const css = p.files.filter(f => f.name.endsWith('.css')).map(f => f.content).join('\n');
                const js = p.files.filter(f => f.name.endsWith('.js')).map(f => f.content).join('\n');
                
                const doc = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<style>${css}</style>\n</head>\n<body>\n${html}\n<script>${js}<\/script>\n</body>\n</html>`;
                
                const blob = new Blob([doc], { type: 'text/html' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `${p.name.replace(/\s+/g,'-')}.html`;
                a.click(); URL.revokeObjectURL(a.href); UI.showToast("Exported to Files");
            },

            exportProject: () => { Workspace.exportHomeProj(State.currentProjId); },
            
            openNewTab: () => { if(State.blobUrl) window.open(State.blobUrl, '_blank'); else { Engine.run(); setTimeout(()=>window.open(State.blobUrl, '_blank'), 500); } }
        };

        // --- COMPILER ENGINE ---
        const Engine = {
            getDoc: () => {
                const html = State.files.find(f => f.name === 'index.html')?.content || State.files.filter(f=>f.name.endsWith('.html'))[0]?.content || '';
                const css = State.files.filter(f => f.name.endsWith('.css')).map(f => f.content).join('\n');
                const js = State.files.filter(f => f.name.endsWith('.js')).map(f => f.content).join('\n');
                return `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n<style>${css}</style>\n<script>\nwindow.onerror=function(m,u,l){window.parent.postMessage({src:'nova',type:'error',msg:m+' (Line: '+l+')'},'*');return false;};\nconst ol=console.log,ow=console.warn,oe=console.error,oi=console.info;\nfunction fmt(a){return Array.from(a).map(x=>{if(typeof x==='object'){try{return JSON.stringify(x,null,2)}catch(e){return String(x)}}return String(x)}).join(' ')}\nconsole.log=function(...a){window.parent.postMessage({src:'nova',type:'log',msg:fmt(a)},'*');ol.apply(console,a)};\nconsole.warn=function(...a){window.parent.postMessage({src:'nova',type:'warn',msg:fmt(a)},'*');ow.apply(console,a)};\nconsole.error=function(...a){window.parent.postMessage({src:'nova',type:'error',msg:fmt(a)},'*');oe.apply(console,a)};\nconsole.info=function(...a){window.parent.postMessage({src:'nova',type:'info',msg:fmt(a)},'*');oi.apply(console,a)};\n<\/script>\n</head>\n<body>\n${html}\n<script>${js}<\/script>\n</body>\n</html>`;
            },
            run: () => {
                if (Els.loader) Els.loader.style.display = 'block'; 
                Engine.clearConsole();
                Els.runBtn.classList.remove('run-pulse');
                const blob = new Blob([Engine.getDoc()], { type: 'text/html' });
                if (State.blobUrl) URL.revokeObjectURL(State.blobUrl);
                State.blobUrl = URL.createObjectURL(blob);
                Els.iframe.src = State.blobUrl;
                setTimeout(() => { if (Els.loader) Els.loader.style.display = 'none'; if(!State.autoRun) UI.showToast("Compiled"); }, 400);
            },
            handleMessage: (e) => {
                if (e.data && e.data.src === 'nova') {
                    State.consoleLogs.push({ type: e.data.type, msg: e.data.msg, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) });
                    Engine.renderConsole();
                }
            },
            renderConsole: () => {
                if (!State.consoleLogs.length) { Els.consoleOut.innerHTML = '<div class="text-apple-label italic opacity-50 text-center mt-4 text-[13px]">No Output</div>'; return; }
                Els.consoleOut.innerHTML = State.consoleLogs.map(l => {
                    let st = 'text-white', ic = '<i data-lucide="chevron-right" class="w-3 h-3 text-apple-label mt-0.5"></i>';
                    if(l.type==='error'){ st='text-[#FF3B30]'; ic='<i data-lucide="x-circle" class="w-3.5 h-3.5 text-[#FF3B30] mt-0.5"></i>'; }
                    if(l.type==='warn'){ st='text-[#FFCC00]'; ic='<i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-[#FFCC00] mt-0.5"></i>'; }
                    if(l.type==='info'){ st='text-apple-blue'; ic='<i data-lucide="info" class="w-3.5 h-3.5 text-apple-blue mt-0.5"></i>'; }
                    const msg = l.msg.includes('\n') ? `<pre class="mt-1 font-mono text-[11px] bg-black/40 p-3 rounded-xl border border-white/5 overflow-x-auto shadow-inner">${l.msg}</pre>` : `<span>${l.msg}</span>`;
                    return `<div class="flex gap-2.5 items-start border-b border-apple-border/50 py-2 break-words">${ic}<div class="flex-1 min-w-0 ${st}">${msg}</div><span class="text-apple-label text-[10px] mt-1 whitespace-nowrap font-medium">${l.time}</span></div>`;
                }).join('');
                lucide.createIcons(); Els.consoleOut.scrollTop = Els.consoleOut.scrollHeight;
            },
            clearConsole: () => { State.consoleLogs = []; Engine.renderConsole(); }
        };

        // --- GLOBAL HELPERS ---
        function setTheme(t) { document.documentElement.className = `dark theme-${t}`; State.theme = t; }

        // Boot
        UI.init(); Workspace.init();
    </script>
</body>
</html>
