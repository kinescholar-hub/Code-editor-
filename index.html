<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft Premium Studio</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        },
                        dark: {
                            bg: '#09090b',         /* Deepest background */
                            surface: '#121214',    /* Panels */
                            surfaceHover: '#18181b',
                            border: '#27272a',
                            text: '#e4e4e7',
                            muted: '#a1a1aa'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(99, 102, 241, 0.15)',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Premium Scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border: 3px solid #121214; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        ::-webkit-scrollbar-corner { background: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        body { background-color: #09090b; color: #e4e4e7; overflow: hidden; }

        /* Draggable Divider */
        #resizer {
            width: 4px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.2s ease;
            position: relative;
            z-index: 20;
        }
        #resizer:hover, #resizer.dragging {
            background-color: #6366f1;
        }

        /* Editor textarea specific styling */
        #code-editor {
            tab-size: 2;
            caret-color: #6366f1;
        }
        #code-editor::selection {
            background-color: rgba(99, 102, 241, 0.3);
        }

        /* Active Line Highlight Mock */
        .line-number { transition: color 0.2s; }
        .line-number.active { color: #e4e4e7; background: rgba(255,255,255,0.05); }

        /* Toast Animation */
        .toast-enter { transform: translateY(150%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }

        /* Loading Bar */
        .loader-bar {
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            width: 100%;
            position: absolute;
            top: 0;
            left: -100%;
            animation: loading 1s infinite;
            display: none;
            z-index: 50;
        }
        @keyframes loading {
            100% { left: 100%; }
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen font-sans selection:bg-brand-500/30">

    <!-- Top Header -->
    <header class="h-14 flex-shrink-0 bg-dark-surface border-b border-dark-border flex items-center justify-between px-4 z-30 shadow-md">

            <div class="bg-gradient-to-br from-brand-500 to-purple-600 p-1.5 rounded-lg shadow-glow">

        </div>

            <!-- Run Controls -->

                <label class="flex items-center gap-2 text-xs font-medium cursor-pointer text-dark-muted hover:text-white transition-colors">
                    <input type="checkbox" id="auto-run-toggle" checked class="accent-brand-500 w-3.5 h-3.5 cursor-pointer">
                    Auto-Compile

                <button id="run-btn" disabled class="flex items-center gap-1.5 text-xs font-semibold transition-all text-dark-muted opacity-50 cursor-not-allowed">

            </div>

            <div class="flex items-center space-x-1 border border-dark-border rounded-lg bg-dark-bg p-1">
                <button onclick="setViewMode('editor')" id="btn-view-editor" class="p-1.5 rounded-md text-dark-muted hover:text-white hover:bg-dark-surface transition-all" title="Editor"><i data-lucide="code-2" class="w-4 h-4"></i></button>
                <button onclick="setViewMode('split')" id="btn-view-split" class="p-1.5 rounded-md bg-dark-surface border border-dark-border text-brand-500 shadow-sm transition-all" title="Split"><i data-lucide="layout" class="w-4 h-4"></i></button>
                <button onclick="setViewMode('preview')" id="btn-view-preview" class="p-1.5 rounded-md text-dark-muted hover:text-white hover:bg-dark-surface transition-all" title="Preview"><i data-lucide="laptop" class="w-4 h-4"></i></button>
            </div>

            <button onclick="exportProject()" class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all" title="Export full project">

                        <button onclick="downloadCurrentFile()" class="p-1.5 text-dark-muted hover:text-white rounded-md hover:bg-white/10 transition-colors" title="Download file"><i data-lucide="download-cloud" class="w-4 h-4"></i></button>
                    </div>
                </div>
                
                <!-- Code Area -->
                <div class="flex-1 flex overflow-hidden relative bg-[#0c0c0e]">
                    <div id="line-numbers" class="w-12 flex-shrink-0 flex flex-col items-end pr-3 py-4 text-[13px] font-mono select-none bg-[#0c0c0e] text-[#4a4a52] border-r border-dark-border overflow-hidden">
                        <!-- Lines -->
                    </div>
                    <textarea id="code-editor" spellcheck="false" class="flex-1 w-full h-full p-4 font-mono text-[14px] leading-relaxed resize-none outline-none whitespace-pre overflow-auto bg-transparent text-[#d4d4d8] focus:ring-0 tracking-wide"></textarea>
                </div>
            </section>

            <!-- Draggable Resizer -->
            <div id="resizer" class="hidden md:block"></div>

            <!-- Preview Section -->
            <section id="preview-section" class="flex flex-col min-w-[200px] bg-dark-bg border-l border-dark-border relative" style="width: 50%;">
                <div id="loader" class="loader-bar"></div>
                
                <!-- Mock Browser UI -->
                <div class="h-10 border-b border-dark-border bg-dark-surface flex items-center px-3 gap-3 flex-shrink-0">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>

                        <button onclick="runCode()" class="absolute right-2 opacity-0 group-hover:opacity-100 text-dark-muted hover:text-white transition-opacity"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i></button>
                    </div>
                    <button onclick="openPreviewInNewTab()" class="text-dark-muted hover:text-white transition-colors" title="Open in new tab">
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Iframe Container -->
                <div class="flex-1 relative bg-white overflow-hidden">
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin" class="w-full h-full border-none absolute inset-0 bg-white"></iframe>
                </div>
                
                <!-- Console -->
                <div class="h-1/3 min-h-[150px] max-h-[60%] flex flex-col border-t border-dark-border bg-[#0c0c0e] shadow-2xl relative">
                    <!-- Console Drag Handle (Vertical) -->
                    <div class="absolute top-0 left-0 w-full h-1 cursor-row-resize -mt-0.5 z-10 hover:bg-brand-500/50 transition-colors"></div>
                    
                    <div class="flex justify-between items-center px-4 py-2 bg-dark-surface border-b border-dark-border text-xs text-dark-text">
                        <div class="flex items-center gap-2 font-medium"><i data-lucide="terminal-square" class="w-4 h-4 text-brand-500"></i> Developer Console</div>
                        <button onclick="clearConsole()" class="text-dark-muted hover:text-red-400 flex gap-1.5 items-center transition-colors">
                            <i data-lucide="ban" class="w-3.5 h-3.5"></i> Clear
                        </button>
                    </div>
                    <div id="console-output" class="flex-1 overflow-y-auto p-3 font-mono text-[12px] leading-relaxed flex flex-col gap-1.5">
                        <div class="text-dark-muted italic opacity-50 select-none">Console is connected...</div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Custom Toast -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 z-50 text-white bg-dark-surface border border-dark-border toast-enter transition-all duration-300">
        <div id="toast-icon-wrapper" class="p-1 rounded bg-white/10">

        <span id="toast-message" class="text-sm font-medium pr-2">Success</span>
    </div>

const elements = {
  counter: document.getElementById('counter'),
  btnInc: document.getElementById('btn-inc'),
  btnDec: document.getElementById('btn-dec'),
  status: document.getElementById('status')
};

let state = {
  count: 0,
  history: []
};

function updateUI() {
  elements.counter.textContent = state.count;
  
  // Dynamic styling based on value
  if (state.count > 0) {
    elements.counter.style.color = '#34d399'; // Green
    elements.status.textContent = 'Increasing';
    elements.status.style.color = '#34d399';
    elements.status.style.background = 'rgba(16, 185, 129, 0.1)';
    elements.status.style.borderColor = 'rgba(16, 185, 129, 0.2)';
  } else if (state.count < 0) {
    elements.counter.style.color = '#f87171'; // Red
    elements.status.textContent = 'Decreasing';
    elements.status.style.color = '#f87171';
    elements.status.style.background = 'rgba(239, 68, 68, 0.1)';
    elements.status.style.borderColor = 'rgba(239, 68, 68, 0.2)';
  } else {
    elements.counter.style.color = '#f8fafc'; // White
    elements.status.textContent = 'System Ready';
    elements.status.style.color = '#94a3b8';
    elements.status.style.background = 'rgba(255, 255, 255, 0.05)';
    elements.status.style.borderColor = 'rgba(255, 255, 255, 0.1)';
  }
}

// Event Listeners with console logging for IDE demo
elements.btnInc.addEventListener('click', () => {
  state.count++;
  state.history.push({ action: 'increment', value: state.count, time: new Date().toLocaleTimeString() });
  console.log('Value increased:', state.count);
  updateUI();
});

elements.btnDec.addEventListener('click', () => {
  state.count--;
  state.history.push({ action: 'decrement', value: state.count, time: new Date().toLocaleTimeString() });
  console.warn('Value decreased:', state.count);
  updateUI();
});

// Demo array object in console
console.info('Application Initialization Complete.', { 
  version: '2.0.0', 
  engine: 'CodeCraft Premium' 
});`

        ];
        
        let activeFileId = '1';
        let autoRun = true;
        let consoleLogs = [];
        let runTimeout = null;
        let blobUrl = null;

        // UI Elements Cache
        const els = {
            fileList: document.getElementById('file-list'),
            editorTabs: document.getElementById('editor-tabs'),
            editor: document.getElementById('code-editor'),
            lineNumbers: document.getElementById('line-numbers'),
            previewFrame: document.getElementById('preview-frame'),
            consoleOutput: document.getElementById('console-output'),
            autoRunToggle: document.getElementById('auto-run-toggle'),
            runBtn: document.getElementById('run-btn'),
            loader: document.getElementById('loader'),
            resizer: document.getElementById('resizer'),
            editorSection: document.getElementById('editor-section'),
            previewSection: document.getElementById('preview-section'),
            workspace: document.getElementById('workspace-container')
        };

        // --- INIT ---
        function init() {
            lucide.createIcons();
            renderUI();
            runCode();
            setupEventListeners();
            setupSplitter();
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            els.editor.addEventListener('input', handleEditorInput);
            els.editor.addEventListener('scroll', syncScroll);
            els.editor.addEventListener('keydown', handleEditorKeys);
            
            els.autoRunToggle.addEventListener('change', (e) => {
                autoRun = e.target.checked;
                els.runBtn.disabled = autoRun;
                els.runBtn.className = autoRun 
                    ? "flex items-center gap-1.5 text-xs font-semibold transition-all text-dark-muted opacity-50 cursor-not-allowed" 
                    : "flex items-center gap-1.5 text-xs font-semibold transition-all text-brand-500 hover:text-brand-400 bg-brand-500/10 px-3 py-1.5 rounded-md";
                if(autoRun) runCode();
            });
            
            els.runBtn.addEventListener('click', () => { if(!autoRun) runCode(); });
            window.addEventListener('message', handleIframeMessage);
        }

        // --- SPLITTER LOGIC ---
        function setupSplitter() {
            let isDragging = false;
            els.resizer.addEventListener('mousedown', (e) => {
                isDragging = true;
                els.resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                // Prevent iframe from intercepting mouse events during drag
                els.previewFrame.style.pointerEvents = 'none'; 
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const containerRect = els.workspace.getBoundingClientRect();
                // Calculate percentage
                let newWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
                // Constraints (min 20%, max 80%)
                if (newWidth < 20) newWidth = 20;
                if (newWidth > 80) newWidth = 80;
                
                els.editorSection.style.width = `${newWidth}%`;
                els.previewSection.style.width = `${100 - newWidth}%`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    els.resizer.classList.remove('dragging');
                    document.body.style.cursor = 'default';
                    els.previewFrame.style.pointerEvents = 'auto';
                }
            });
        }

        // --- RENDER LOGIC ---
        function renderUI() {
            renderFileList();
            renderTabs();
            
            const activeFile = files.find(f => f.id === activeFileId);
            if(activeFile && els.editor.value !== activeFile.content) {
                els.editor.value = activeFile.content;
            }
            updateLineNumbers();
            lucide.createIcons();
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.html')) return '<i data-lucide="code-2" class="w-4 h-4 text-orange-500"></i>';
            if (filename.endsWith('.css')) return '<i data-lucide="palette" class="w-4 h-4 text-blue-400"></i>';
            if (filename.endsWith('.js')) return '<i data-lucide="file-json-2" class="w-4 h-4 text-yellow-400"></i>';
            return '<i data-lucide="file-text" class="w-4 h-4 text-gray-400"></i>';
        }

        function renderFileList() {
            els.fileList.innerHTML = files.map(file => `
                <div onclick="setActiveFile('${file.id}')" class="flex justify-between items-center px-3 py-2 rounded-md cursor-pointer text-[13px] group transition-all ${activeFileId === file.id ? 'bg-brand-500/10 text-brand-500 font-medium' : 'hover:bg-white/5 text-dark-text'}">
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        ${getFileIcon(file.name)}
                        <span class="truncate">${file.name}</span>
                    </div>
                    <button onclick="deleteFile(event, '${file.id}')" class="opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');
        }

        function renderTabs() {
            els.editorTabs.innerHTML = files.map(file => `
                <div onclick="setActiveFile('${file.id}')" class="flex items-center px-4 py-2.5 cursor-pointer border-r border-dark-border text-[13px] whitespace-nowrap min-w-fit transition-colors relative ${activeFileId === file.id ? 'bg-[#0c0c0e] text-white font-medium' : 'bg-dark-surface hover:bg-[#0c0c0e]/50 text-dark-muted'}">
                    ${activeFileId === file.id ? '<div class="absolute top-0 left-0 w-full h-0.5 bg-brand-500"></div>' : ''}
                    <span class="mr-2">${getFileIcon(file.name)}</span>
                    <span ondblclick="renameFile(event, '${file.id}')" class="select-none">${file.name}</span>
                    <div class="w-4 ml-3 flex items-center justify-center">
                        <button onclick="deleteFile(event, '${file.id}')" class="opacity-0 hover:opacity-100 text-dark-muted hover:text-red-400 transition-all ${activeFileId === file.id ? 'opacity-40' : ''}">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateLineNumbers() {
            const lines = els.editor.value.split('\n').length;
            els.lineNumbers.innerHTML = Array.from({ length: lines }).map((_, i) => `<div class="leading-relaxed h-[21px]">${i + 1}</div>`).join('');
        }

        function syncScroll() {
            els.lineNumbers.scrollTop = els.editor.scrollTop;
        }

        // --- EDITOR ACTIONS ---
        function setActiveFile(id) {
            activeFileId = id;
            renderUI();
        }

        function handleEditorInput(e) {
            const activeFile = files.find(f => f.id === activeFileId);
            if(activeFile) {
                activeFile.content = e.target.value;
                updateLineNumbers();
                
                if (autoRun) {
                    clearTimeout(runTimeout);
                    els.loader.style.display = 'block';
                    runTimeout = setTimeout(runCode, 1000);
                }
            }
        }

        function handleEditorKeys(e) {
            // Tab support
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                handleEditorInput({ target: this }); 
            }
            // Auto-close brackets/quotes (Basic)
            const pairs = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };
            if (pairs[e.key]) {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + e.key + pairs[e.key] + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                handleEditorInput({ target: this });
            }
        }

        function createFile() {
            const name = prompt("Enter new file name (e.g., component.js):");
            if (name && name.trim()) {
                const newFile = { id: Date.now().toString(), name: name.trim(), content: '' };
                files.push(newFile);
                activeFileId = newFile.id;
                renderUI();
                showToast("File created", "success");
            }
        }

        function renameFile(e, id) {
            e.stopPropagation();
            const file = files.find(f => f.id === id);
            const newName = prompt("Rename file:", file.name);
            if (newName && newName.trim()) {
                file.name = newName.trim();
                renderUI();
            }
        }

        function deleteFile(e, id) {
            e.stopPropagation();
            if (files.length <= 1) return showToast("Cannot delete the last file.", "error");
            if (confirm(`Delete ${files.find(f=>f.id===id).name}?`)) {
                files = files.filter(f => f.id !== id);
                if (activeFileId === id) activeFileId = files[0].id;
                renderUI();
            }
        }

        // --- COMPILER & PREVIEW ---
        function generateBlobURL() {
            const htmlFiles = files.filter(f => f.name.endsWith('.html'));
            const cssFiles = files.filter(f => f.name.endsWith('.css'));
            const jsFiles = files.filter(f => f.name.endsWith('.js'));

            const mainHtml = htmlFiles.find(f => f.name === 'index.html')?.content || htmlFiles[0]?.content || '';
            const combinedCss = cssFiles.map(f => f.content).join('\n');
            const combinedJs = jsFiles.map(f => f.content).join('\n');

            const fullHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>${combinedCss}</style>
    <script>
        // Console Interceptor for Premium formatting
        window.onerror = function(msg, url, line) {
            window.parent.postMessage({ source: 'ide-iframe', type: 'error', message: msg + ' (Line: ' + line + ')' }, '*');
            return false;
        };
        const origLog = console.log, origWarn = console.warn, origErr = console.error, origInfo = console.info;
        
        function formatArgs(args) {
            return Array.from(args).map(a => {
                if(typeof a === 'object') {
                    try { return JSON.stringify(a, null, 2); } catch(e) { return String(a); }
                }
                return String(a);
            }).join(' ');
        }
        
        console.log = function(...args) { window.parent.postMessage({ source: 'ide-iframe', type: 'log', message: formatArgs(args) }, '*'); origLog.apply(console, args); };
        console.warn = function(...args) { window.parent.postMessage({ source: 'ide-iframe', type: 'warn', message: formatArgs(args) }, '*'); origWarn.apply(console, args); };
        console.error = function(...args) { window.parent.postMessage({ source: 'ide-iframe', type: 'error', message: formatArgs(args) }, '*'); origErr.apply(console, args); };
        console.info = function(...args) { window.parent.postMessage({ source: 'ide-iframe', type: 'info', message: formatArgs(args) }, '*'); origInfo.apply(console, args); };
    <\/script>
</head>
<body>
    ${mainHtml}
    <script>${combinedJs}<\/script>
</body>
</html>`;

            const blob = new Blob([fullHTML], { type: 'text/html' });
            if (blobUrl) URL.revokeObjectURL(blobUrl); // Cleanup old
            blobUrl = URL.createObjectURL(blob);
            return blobUrl;
        }

        function runCode() {
            els.loader.style.display = 'block';
            els.previewFrame.src = generateBlobURL();
            
            // Artificial delay to show loader animation and clear console on new run
            setTimeout(() => {
                els.loader.style.display = 'none';
                if(!autoRun) showToast("Build complete", "success");
            }, 300);
        }

        // --- CONSOLE ---
        function handleIframeMessage(event) {
            if (event.data && event.data.source === 'ide-iframe') {
                consoleLogs.push({
                    type: event.data.type,
                    message: event.data.message,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})
                });
                renderConsole();
            }
        }

        function renderConsole() {
            if (consoleLogs.length === 0) {
                els.consoleOutput.innerHTML = '<div class="text-dark-muted italic opacity-50 select-none">Console cleared. Waiting for output...</div>';
                return;
            }
            
            els.consoleOutput.innerHTML = consoleLogs.map(log => {
                let styles = 'text-gray-300';
                let icon = '<i data-lucide="chevron-right" class="w-3 h-3 text-gray-500 mt-0.5"></i>';
                let bg = 'hover:bg-white/5 rounded px-2 py-1 transition-colors';
                
                if(log.type === 'error') {
                    styles = 'text-red-400';
                    icon = '<i data-lucide="x-circle" class="w-3 h-3 text-red-500 mt-0.5"></i>';
                    bg = 'bg-red-500/10 rounded px-2 py-1 border border-red-500/20';
                }
                if(log.type === 'warn') {
                    styles = 'text-yellow-400';
                    icon = '<i data-lucide="alert-triangle" class="w-3 h-3 text-yellow-500 mt-0.5"></i>';
                    bg = 'bg-yellow-500/10 rounded px-2 py-1 border border-yellow-500/20';
                }
                if(log.type === 'info') {
                    styles = 'text-blue-400';
                    icon = '<i data-lucide="info" class="w-3 h-3 text-blue-500 mt-0.5"></i>';
                }
                
                // Format multi-line logs (like objects)
                const formattedMessage = log.message.includes('\n') 
                    ? `<pre class="mt-1 font-mono text-[11px] bg-black/30 p-2 rounded border border-white/5 overflow-x-auto">${log.message}</pre>`
                    : `<span>${log.message}</span>`;
                
                return `<div class="flex gap-2 items-start ${bg} break-words">
                    ${icon}
                    <div class="flex-1 min-w-0 ${styles}">
                        ${formattedMessage}
                    </div>
                    <span class="opacity-30 text-[9px] flex-shrink-0 mt-0.5">${log.time}</span>
                </div>`;
            }).join('');
            
            lucide.createIcons();
            els.consoleOutput.scrollTop = els.consoleOutput.scrollHeight;
        }

        function clearConsole() {
            consoleLogs = [];
            renderConsole();
        }

        // --- UTILITIES ---
        function setViewMode(mode) {
            // Reset active button states
            ['btn-view-editor', 'btn-view-split', 'btn-view-preview'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "p-1.5 rounded-md text-dark-muted hover:text-white hover:bg-dark-surface transition-all";
            });

            // Set active
            const activeBtn = document.getElementById(`btn-view-${mode}`);
            activeBtn.className = "p-1.5 rounded-md bg-dark-surface border border-dark-border text-brand-500 shadow-sm transition-all";

            // Toggle sections
            els.editorSection.style.display = (mode === 'split' || mode === 'editor') ? 'flex' : 'none';
            els.previewSection.style.display = (mode === 'split' || mode === 'preview') ? 'flex' : 'none';
            els.resizer.style.display = mode === 'split' ? 'block' : 'none';

            // Reset widths on split
            if(mode === 'split') {
                els.editorSection.style.width = '50%';
                els.previewSection.style.width = '50%';
            } else {
                els.editorSection.style.width = '100%';
                els.previewSection.style.width = '100%';
            }
        }

        async function copyFileContent() {
            const content = els.editor.value;
            try {
                await navigator.clipboard.writeText(content);
                showToast("Copied to clipboard", "success");
            } catch (err) {
                // Fallback for iframe restrictions
                const textArea = document.createElement("textarea");
                textArea.value = content;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Copied to clipboard", "success");
                } catch (e) {
                    showToast("Failed to copy", "error");
                }
                document.body.removeChild(textArea);
            }
        }

        function downloadCurrentFile() {
            const activeFile = files.find(f => f.id === activeFileId);
            if(!activeFile) return;
            const blob = new Blob([activeFile.content], { type: 'text/plain' });
            triggerDownload(blob, activeFile.name);
            showToast(`${activeFile.name} downloaded`, "success");
        }

        function exportProject() {
            fetch(blobUrl).then(res => res.blob()).then(blob => {
                triggerDownload(blob, 'CodeCraft-Project.html');
                showToast("Full project exported!", "success");
            });
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openPreviewInNewTab() {
            if(blobUrl) {
                window.open(blobUrl, '_blank');
            } else {
                showToast("Please wait for build", "error");
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const iconWrap = document.getElementById('toast-icon-wrapper');
            const icon = document.getElementById('toast-icon');
            
            document.getElementById('toast-message').innerText = message;
            
            if (type === 'error') {
                iconWrap.className = 'p-1 rounded bg-red-500/20 text-red-400';
                icon.setAttribute('data-lucide', 'alert-circle');
            } else {
                iconWrap.className = 'p-1 rounded bg-emerald-500/20 text-emerald-400';
                icon.setAttribute('data-lucide', 'check-circle');
            }
            
            lucide.createIcons();
            
            toast.classList.add('toast-active');
            toast.classList.remove('toast-enter');
            
            setTimeout(() => {
                toast.classList.remove('toast-active');
                toast.classList.add('toast-enter');
            }, 3000);
        }

        // Start App
        init();
    </script>
</body>
</html>
