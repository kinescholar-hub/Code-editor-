<!DOCTYPE html>
<html lang="en" class="dark theme-indigo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Web Studio</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: { 400: 'var(--brand-400)', 500: 'var(--brand-500)', 600: 'var(--brand-600)' },
                        dark: {
                            bg: '#030305',        /* Pitch black backdrop */
                            surface: '#0a0a0f',   /* Glass panels */
                            border: '#1a1a24',    /* Crisp borders */
                            text: '#f4f4f5',
                            muted: '#8b8b9e'
                        }
                    },
                    boxShadow: { 
                        'glow': '0 0 20px var(--brand-glow)',
                        'inner-glow': 'inset 0 1px 1px rgba(255,255,255,0.1)'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Indigo Theme (Default) */
            --brand-400: #818cf8; --brand-500: #6366f1; --brand-600: #4f46e5;
            --brand-glow: rgba(99, 102, 241, 0.25); --brand-bg: rgba(99, 102, 241, 0.1);
        }
        .theme-emerald { --brand-400: #34d399; --brand-500: #10b981; --brand-600: #059669; --brand-glow: rgba(16, 185, 129, 0.25); --brand-bg: rgba(16, 185, 129, 0.1); }
        .theme-rose { --brand-400: #fb7185; --brand-500: #f43f5e; --brand-600: #e11d48; --brand-glow: rgba(244, 63, 94, 0.25); --brand-bg: rgba(244, 63, 94, 0.1); }
        .theme-amber { --brand-400: #fbbf24; --brand-500: #f59e0b; --brand-600: #d97706; --brand-glow: rgba(245, 158, 11, 0.25); --brand-bg: rgba(245, 158, 11, 0.1); }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a3b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-500); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        body { background-color: var(--dark-bg); color: var(--dark-text); overflow: hidden; }

        /* Ambient Background Glow */
        .ambient-light {
            position: fixed; top: -20vh; left: -10vw; width: 50vw; height: 50vh;
            background: var(--brand-500); filter: blur(150px); opacity: 0.15;
            pointer-events: none; z-index: 0; transition: background 0.5s ease;
        }

        /* NOVA Animated Title Graphics */
        .nova-title {
            font-size: 1.35rem; font-weight: 800; letter-spacing: -0.04em;
            background: linear-gradient(to right, #ffffff, var(--brand-400), var(--brand-600), #ffffff);
            background-size: 300% auto; color: transparent;
            -webkit-background-clip: text; background-clip: text;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 300% center; } }

        /* Custom Editor Component */
        .editor-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050508; z-index: 10; }
        .editor-textarea, .editor-pre {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 1.5rem; font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.6;
            white-space: pre; word-wrap: normal; overflow-wrap: normal; overflow: auto;
            tab-size: 2; margin: 0; border: none; outline: none;
        }
        .editor-textarea {
            color: transparent; background: transparent; caret-color: var(--brand-400); z-index: 2; resize: none;
        }
        .editor-textarea::selection { background-color: var(--brand-bg); color: transparent; }
        .editor-pre { z-index: 1; pointer-events: none; color: #a1a1aa; }
        
        /* Syntax Colors (Vibrant Dark Theme) */
        .syn-keyword { color: #ff7b72; font-weight: 500; } 
        .syn-string { color: #a5d6ff; } 
        .syn-number { color: #79c0ff; }
        .syn-comment { color: #8b949e; font-style: italic; } 
        .syn-function { color: #d2a8ff; font-weight: 500; }
        .syn-tag { color: #7ee787; } 
        .syn-attr { color: #79c0ff; } 
        .syn-property { color: #d2a8ff; }

        /* Interactive Elements */
        #resizer { width: 4px; cursor: col-resize; background: transparent; transition: background 0.2s ease; position: relative; z-index: 30; }
        #resizer:hover, #resizer.dragging { background: var(--brand-500); box-shadow: var(--glow); }
        .modal-backdrop { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); background: rgba(3,3,5,0.7); }
        
        /* Loader */
        .loader-bar {
            height: 2px; background: linear-gradient(90deg, transparent, var(--brand-400), #fff, var(--brand-400), transparent);
            width: 100%; position: absolute; top: 0; left: -100%; animation: loading 1.5s infinite; z-index: 50; display: none;
        }
        @keyframes loading { 100% { left: 100%; } }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen font-sans selection:bg-brand-500/30">

    <!-- Ambient Lighting Effect -->
    <div class="ambient-light"></div>

    <!-- Graphical Top Header -->
    <header class="h-16 flex-shrink-0 bg-dark-surface/80 backdrop-blur-md border-b border-dark-border flex items-center justify-between px-4 z-40 relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleMobileSidebar()" class="md:hidden p-1.5 text-dark-muted hover:text-white rounded-md transition-colors"><i data-lucide="menu" class="w-5 h-5"></i></button>
            
            <!-- NOVA Logo Graphic -->
            <div onclick="UI.toggleProjectModal()" class="flex items-center gap-3 group cursor-pointer p-1 rounded-xl hover:bg-white/5 transition-all">
                <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-dark-surface to-[#000] border border-white/10 shadow-glow group-hover:scale-105 transition-transform duration-300">
                    <i data-lucide="sparkles" class="w-4 h-4 text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]" style="color: var(--brand-400)"></i>
                    <div class="absolute inset-0 rounded-xl ring-1 ring-inset ring-white/10"></div>
                </div>
                <div class="flex flex-col leading-tight hidden sm:flex">
                    <div class="flex items-center gap-1.5">
                        <span class="nova-title">NOVA</span>
                        <span class="text-[9px] font-bold tracking-widest text-white/70 bg-white/10 px-1.5 py-0.5 rounded shadow-inner-glow">STUDIO</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <span id="current-project-title" class="text-[11px] text-dark-muted font-medium truncate max-w-[150px] group-hover:text-white transition-colors">Loading...</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-dark-muted group-hover:text-brand-400 transition-colors"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-3 md:gap-4">
            <!-- Theme Color Selector -->
            <div class="hidden lg:flex items-center gap-2 bg-[#000]/40 px-2.5 py-1.5 rounded-full border border-dark-border shadow-inner">
                <button onclick="setTheme('indigo')" class="w-3.5 h-3.5 rounded-full bg-[#6366f1] ring-2 ring-transparent hover:ring-[#6366f1]/50 transition-all"></button>
                <button onclick="setTheme('emerald')" class="w-3.5 h-3.5 rounded-full bg-[#10b981] ring-2 ring-transparent hover:ring-[#10b981]/50 transition-all"></button>
                <button onclick="setTheme('rose')" class="w-3.5 h-3.5 rounded-full bg-[#f43f5e] ring-2 ring-transparent hover:ring-[#f43f5e]/50 transition-all"></button>
                <button onclick="setTheme('amber')" class="w-3.5 h-3.5 rounded-full bg-[#f59e0b] ring-2 ring-transparent hover:ring-[#f59e0b]/50 transition-all"></button>
            </div>

            <!-- Run / Build Controls -->
            <div class="hidden sm:flex items-center gap-3 bg-[#000]/40 px-3 py-1.5 rounded-xl border border-dark-border shadow-inner">
                <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer text-dark-muted hover:text-white transition-colors">
                    <input type="checkbox" id="auto-run-toggle" checked class="accent-brand-500 w-3.5 h-3.5 cursor-pointer"> Live Sync
                </label>
                <div class="w-px h-4 bg-dark-border"></div>
                <button id="run-btn" disabled class="flex items-center gap-1.5 text-xs font-bold transition-all text-dark-muted opacity-50 cursor-not-allowed uppercase tracking-wider">
                    <i data-lucide="zap" class="w-3.5 h-3.5 fill-current"></i> Build
                </button>
            </div>

            <!-- View Modes -->
            <div class="flex items-center space-x-1 border border-dark-border rounded-xl bg-[#000]/40 p-1 shadow-inner">
                <button onclick="UI.setViewMode('editor')" id="btn-view-editor" class="p-1.5 rounded-lg text-dark-muted hover:text-white hover:bg-white/5 transition-all" title="Code"><i data-lucide="code-2" class="w-4 h-4"></i></button>
                <button onclick="UI.setViewMode('split')" id="btn-view-split" class="hidden md:block p-1.5 rounded-lg bg-dark-surface border border-dark-border text-brand-400 shadow-glow transition-all" title="Split View"><i data-lucide="layout" class="w-4 h-4"></i></button>
                <button onclick="UI.setViewMode('preview')" id="btn-view-preview" class="p-1.5 rounded-lg text-dark-muted hover:text-white hover:bg-white/5 transition-all" title="Preview"><i data-lucide="play" class="w-4 h-4 md:hidden"></i><i data-lucide="monitor" class="w-4 h-4 hidden md:block"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex overflow-hidden relative z-10">
        
        <!-- Sidebar (File Explorer) -->
        <aside id="sidebar" class="absolute md:relative w-64 md:w-[240px] h-full flex-shrink-0 flex flex-col bg-dark-surface/90 backdrop-blur-xl border-r border-dark-border z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="px-4 py-3 border-b border-dark-border flex justify-between items-center bg-[#000]/20">
                <span class="text-[10px] font-bold text-dark-muted tracking-[0.25em] uppercase">Files</span>
                <div class="flex gap-1">
                    <button onclick="Workspace.createFile()" class="text-dark-muted hover:text-brand-400 hover:bg-brand-500/10 rounded p-1 transition-colors" title="New File"><i data-lucide="file-plus" class="w-4 h-4"></i></button>
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-dark-muted hover:text-white hover:bg-white/10 rounded p-1 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div id="file-list" class="flex-1 overflow-y-auto py-3 px-2 space-y-1"></div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="absolute inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

        <!-- Dynamic Container for Editor and Preview -->
        <div id="workspace-container" class="flex-1 flex flex-col md:flex-row min-w-0 w-full relative">
            
            <!-- CODE EDITOR SECTION -->
            <section id="editor-section" class="flex flex-col min-w-0 w-full md:w-1/2 h-full z-10 bg-[#050508]">
                <!-- Tabs -->
                <div class="flex items-center justify-between border-b border-dark-border bg-dark-surface pr-2 shadow-sm">
                    <div id="editor-tabs" class="flex items-center overflow-x-auto scrollbar-hide flex-1 pt-1 pl-1"></div>
                    <div class="flex items-center gap-1 pl-2 border-l border-dark-border hidden md:flex">
                        <button onclick="Workspace.copyContent()" class="p-1.5 text-dark-muted hover:text-brand-400 rounded-lg hover:bg-brand-500/10 transition-colors" title="Copy code"><i data-lucide="copy" class="w-4 h-4"></i></button>
                    </div>
                </div>
                
                <!-- Editor Core -->
                <div class="flex-1 flex overflow-hidden relative editor-container">
                    <div id="line-numbers" class="w-12 flex-shrink-0 flex flex-col items-end pr-3 py-[1.5rem] text-[14px] font-mono select-none bg-[#030305] text-dark-muted border-r border-dark-border overflow-hidden opacity-40 z-10 leading-[1.6]"></div>
                    <div class="relative flex-1 h-full overflow-hidden">
                        <pre id="editor-pre" class="editor-pre" aria-hidden="true"><code></code></pre>
                        <textarea id="code-editor" class="editor-textarea" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
                    </div>
                </div>
            </section>

            <!-- DRAGGABLE SPLITTER -->
            <div id="resizer" class="hidden md:flex justify-center items-center group">
                <div class="h-8 w-1 rounded-full bg-white/20 group-hover:bg-white/50 transition-colors"></div>
            </div>

            <!-- LIVE PREVIEW SECTION -->
            <section id="preview-section" class="flex flex-col min-w-0 w-full md:w-1/2 h-full bg-dark-bg md:border-l border-dark-border relative z-10 hidden md:flex">
                <div id="loader" class="loader-bar"></div>
                
                <!-- Mock Browser Bar -->
                <div class="h-12 border-b border-dark-border bg-dark-surface flex items-center px-4 gap-4 flex-shrink-0 shadow-sm">
                    <div class="flex gap-2 opacity-80">
                        <div class="w-3 h-3 rounded-full bg-[#ff5f56] border border-[#e0443e]"></div>
                        <div class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-[#dea123]"></div>
                        <div class="w-3 h-3 rounded-full bg-[#27c93f] border border-[#1aab29]"></div>
                    </div>
                    <div class="flex-1 flex items-center gap-2 bg-[#000]/40 border border-dark-border rounded-lg px-3 py-1.5 max-w-md mx-auto relative group shadow-inner">
                        <i data-lucide="lock" class="w-3 h-3 text-brand-400 opacity-80"></i>
                        <span class="text-[12px] text-dark-muted font-mono truncate select-none">nova.local <span class="opacity-30">/ index.html</span></span>
                        <button onclick="Engine.run()" class="absolute right-2 opacity-0 group-hover:opacity-100 text-dark-muted hover:text-brand-400 transition-opacity"><i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i></button>
                    </div>
                    <button onclick="Workspace.openNewTab()" class="text-dark-muted hover:text-white bg-white/5 p-1.5 rounded-lg transition-colors border border-white/5 hover:border-white/20"><i data-lucide="external-link" class="w-4 h-4"></i></button>
                </div>

                <!-- Iframe -->
                <div class="flex-1 relative bg-white overflow-hidden" id="iframe-wrapper">
                    <!-- Checkboard pattern for transparency indication -->
                    <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: linear-gradient(45deg, #000 25%, transparent 25%), linear-gradient(-45deg, #000 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #000 75%), linear-gradient(-45deg, transparent 75%, #000 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;"></div>
                    <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin" class="w-full h-full border-none absolute inset-0 bg-transparent"></iframe>
                </div>
                
                <!-- Terminal/Console -->
                <div class="h-[30%] min-h-[120px] max-h-[60%] flex flex-col border-t border-dark-border bg-[#030305] relative">
                    <div class="absolute top-0 left-0 w-full h-1.5 cursor-row-resize -mt-1 z-10 hover:bg-brand-500/50 transition-colors"></div>
                    <div class="flex justify-between items-center px-4 py-2 bg-dark-surface/50 border-b border-dark-border text-[11px] text-dark-text tracking-wider uppercase font-bold backdrop-blur-sm">
                        <div class="flex items-center gap-2"><i data-lucide="terminal" class="w-4 h-4 text-brand-400"></i> Dev Console</div>
                        <button onclick="Engine.clearConsole()" class="text-dark-muted hover:text-red-400 flex gap-1 items-center transition-colors"><i data-lucide="trash-2" class="w-3 h-3"></i> Clear</button>
                    </div>
                    <div id="console-output" class="flex-1 overflow-y-auto p-3 font-mono text-[12px] leading-relaxed flex flex-col gap-1.5 shadow-inner"></div>
                </div>
            </section>
        </div>
    </main>

    <!-- CUSTOM DIALOG UI -->
    <div id="dialog-overlay" class="hidden fixed inset-0 modal-backdrop z-[100] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="dialog-box" class="bg-dark-surface border border-dark-border rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300 p-6 flex flex-col gap-4 relative">
            <!-- Glow effect -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-brand-500 to-transparent opacity-50"></div>
            
            <h3 id="dialog-title" class="text-xl font-bold text-white tracking-tight">Title</h3>
            <p id="dialog-message" class="text-sm text-dark-muted leading-relaxed">Message</p>
            <input type="text" id="dialog-input" class="hidden w-full bg-[#000]/50 border border-dark-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all mt-2 shadow-inner">
            <div class="flex justify-end gap-3 mt-4">
                <button id="dialog-cancel" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-dark-muted hover:text-white hover:bg-white/5 transition-colors">Cancel</button>
                <button id="dialog-confirm" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white transition-all shadow-[0_0_15px_var(--brand-glow)] hover:shadow-[0_0_25px_var(--brand-glow)]">Confirm</button>
            </div>
        </div>
    </div>

    <!-- PROJECT MANAGER MODAL -->
    <div id="project-modal" class="hidden fixed inset-0 modal-backdrop z-[60] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-dark-surface border border-dark-border rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[85vh] transform scale-95 transition-transform duration-300 relative" id="project-modal-content">
            <div class="px-6 py-5 border-b border-dark-border flex justify-between items-center bg-[#050508]/50">
                <div class="flex items-center gap-4">
                    <div class="bg-brand-500/10 p-2 rounded-xl text-brand-400 border border-brand-500/20 shadow-glow"><i data-lucide="layers" class="w-6 h-6"></i></div>
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Nova Workspaces</h2>
                        <p class="text-[12px] text-dark-muted mt-0.5">Manage your local browser projects</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="Workspace.exportProject()" class="text-sm font-semibold flex items-center gap-2 text-dark-text hover:text-brand-400 bg-white/5 hover:bg-white/10 px-4 py-2 rounded-xl transition-all border border-white/5"><i data-lucide="download-cloud" class="w-4 h-4"></i> Export</button>
                    <button onclick="UI.toggleProjectModal()" class="text-dark-muted hover:text-white p-2 rounded-xl hover:bg-white/10 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>
            
            <div class="p-5 bg-[#030305] flex gap-3 border-b border-dark-border">
                <div class="relative flex-1">
                    <i data-lucide="folder-plus" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-4 h-4 text-dark-muted"></i>
                    <input type="text" id="new-project-name" placeholder="Name your new workspace..." class="w-full bg-dark-surface border border-dark-border rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all shadow-inner" onkeydown="if(event.key === 'Enter') Workspace.createProject()">
                </div>
                <button onclick="Workspace.createProject()" class="bg-brand-600 hover:bg-brand-500 text-white px-6 py-3 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-glow hover:scale-[1.02]">Create</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 grid gap-3" id="project-list" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
        </div>
    </div>

    <!-- Animated Toast -->
    <div id="toast" class="fixed bottom-8 right-8 px-5 py-4 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex items-center gap-3 z-[110] text-white bg-dark-surface border border-dark-border toast-enter transition-all duration-300">
        <div id="toast-icon-wrapper" class="p-1.5 rounded-lg bg-brand-500/20 text-brand-400 shadow-glow"><i id="toast-icon" data-lucide="check" class="w-5 h-5"></i></div>
        <span id="toast-message" class="text-sm font-semibold pr-2">Success</span>
    </div>

    <!-- Engine Script -->
    <script>
        // --- HIGH-PERFORMANCE SYNTAX HIGHLIGHTER ---
        const Highlighter = {
            highlight: (code, lang) => {
                if (!code) return '';
                // Escape HTML first
                let html = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                if (lang === 'html') {
                    html = html.replace(/(&lt;\/?)([a-zA-Z0-9-]+)(\s|&gt;)/g, '$1<span class="syn-tag">$2</span>$3');
                    html = html.replace(/([a-zA-Z-]+)=/g, '<span class="syn-attr">$1</span>=');
                    html = html.replace(/(&quot;.*?&quot;)/g, '<span class="syn-string">$1</span>');
                    html = html.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="syn-comment">$1</span>');
                } else if (lang === 'css') {
                    html = html.replace(/([a-zA-Z-]+)\s*:/g, '<span class="syn-property">$1</span>:');
                    html = html.replace(/:(.*?);/g, ':<span class="syn-string">$1</span>;');
                    html = html.replace(/([\.#@][a-zA-Z0-9_-]+)/g, '<span class="syn-tag">$1</span>');
                    html = html.replace(/\/\*[\s\S]*?\*\//g, match => `<span class="syn-comment">${match}</span>`);
                } else if (lang === 'javascript' || lang === 'js') {
                    const keywords = /\b(const|let|var|function|return|if|else|for|while|class|import|export|from|new|true|false|null|undefined|async|await|try|catch)\b/g;
                    html = html.replace(keywords, '<span class="syn-keyword">$1</span>');
                    html = html.replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g, '<span class="syn-string">$1</span>');
                    html = html.replace(/\b([0-9]+)\b/g, '<span class="syn-number">$1</span>');
                    html = html.replace(/([a-zA-Z0-9_]+)\s*\(/g, '<span class="syn-function">$1</span>(');
                    html = html.replace(/(\/\/.*|\/\*[\s\S]*?\*\/)/g, match => `<span class="syn-comment">${match}</span>`);
                }
                return html;
            }
        };

        // --- GLASSMORPHISM DIALOG MANAGER ---
        const Dialog = {
            els: {
                overlay: document.getElementById('dialog-overlay'), box: document.getElementById('dialog-box'),
                title: document.getElementById('dialog-title'), msg: document.getElementById('dialog-message'),
                input: document.getElementById('dialog-input'), cancel: document.getElementById('dialog-cancel'), confirm: document.getElementById('dialog-confirm')
            },
            show: (type, title, message, defaultVal = '') => new Promise((resolve) => {
                Dialog.els.title.innerText = title; Dialog.els.msg.innerText = message;
                
                if (type === 'prompt') { Dialog.els.input.classList.remove('hidden'); Dialog.els.input.value = defaultVal; } 
                else { Dialog.els.input.classList.add('hidden'); }
                Dialog.els.cancel.classList.toggle('hidden', type === 'alert');

                const cleanup = () => {
                    Dialog.els.overlay.classList.add('opacity-0'); Dialog.els.box.classList.add('scale-95');
                    setTimeout(() => Dialog.els.overlay.classList.add('hidden'), 300);
                    Dialog.els.confirm.onclick = null; Dialog.els.cancel.onclick = null; Dialog.els.input.onkeydown = null;
                };

                const confirm = () => { cleanup(); resolve(type === 'prompt' ? Dialog.els.input.value : true); };
                const cancel = () => { cleanup(); resolve(type === 'prompt' ? null : false); };

                Dialog.els.confirm.onclick = confirm; Dialog.els.cancel.onclick = cancel;
                Dialog.els.input.onkeydown = (e) => { if (e.key === 'Enter') confirm(); if (e.key === 'Escape') cancel(); };

                Dialog.els.overlay.classList.remove('hidden');
                requestAnimationFrame(() => {
                    Dialog.els.overlay.classList.remove('opacity-0'); Dialog.els.box.classList.remove('scale-95');
                    if (type === 'prompt') Dialog.els.input.focus();
                });
            }),
            alert: (title, msg) => Dialog.show('alert', title, msg),
            confirm: (title, msg) => Dialog.show('confirm', title, msg),
            prompt: (title, msg, def) => Dialog.show('prompt', title, msg, def)
        };

        // --- TEMPLATES ---
        const Templates = {
            nova: [
                { id: '1', name: 'index.html', language: 'html', content: `<!DOCTYPE html>\n<html>\n<head>\n  <title>Nova Preview</title>\n</head>\n<body>\n  <div class="nova-card">\n    <div class="logo">✦</div>\n    <h1>Welcome to NOVA</h1>\n    <p>A beautifully engineered, single-file development environment.</p>\n    <button onclick="testLog()">Test Console System</button>\n  </div>\n</body>\n</html>` },
                { id: '2', name: 'style.css', language: 'css', content: `@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');\n\nbody {\n  background: #030305; color: #fff; font-family: 'Inter', sans-serif;\n  display: grid; place-items: center; min-height: 100vh; margin: 0;\n  background-image: radial-gradient(circle at center, rgba(99,102,241,0.1) 0%, transparent 50%);\n}\n\n.nova-card {\n  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);\n  padding: 3rem; border-radius: 2rem; text-align: center; max-width: 400px;\n  backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5);\n}\n\n.logo {\n  font-size: 3rem; color: #818cf8; margin-bottom: 1rem;\n  animation: spin 6s linear infinite; display: inline-block;\n  text-shadow: 0 0 20px rgba(129,140,248,0.5);\n}\n@keyframes spin { 100% { transform: rotate(360deg); } }\n\nh1 { font-size: 2rem; margin: 0 0 0.5rem; background: linear-gradient(to right, #fff, #818cf8); -webkit-background-clip: text; color: transparent; }\np { color: #8b8b9e; line-height: 1.6; margin-bottom: 2rem; }\n\nbutton {\n  background: #6366f1; color: #fff; border: none; padding: 0.8rem 2rem;\n  border-radius: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s;\n  box-shadow: 0 0 20px rgba(99,102,241,0.3);\n}\nbutton:hover { background: #4f46e5; transform: scale(1.05); }` },
                { id: '3', name: 'script.js', language: 'javascript', content: `console.info('NOVA Engine initialized successfully.');\n\nfunction testLog() {\n  const user = { name: "Developer", engine: "Nova Studio v2.0" };\n  console.log("Button clicked!");\n  console.warn("Processing data:", user);\n}` }
            ]
        };

        // --- APP STATE ---
        const State = {
            projects: {}, currentProjId: null, files: [], activeFileId: null,
            autoRun: true, consoleLogs: [], runTimer: null, blobUrl: null, theme: 'indigo'
        };

        const Els = {
            fileList: document.getElementById('file-list'), tabs: document.getElementById('editor-tabs'),
            editor: document.getElementById('code-editor'), pre: document.getElementById('editor-pre'), codePre: document.querySelector('#editor-pre code'),
            lines: document.getElementById('line-numbers'), iframe: document.getElementById('preview-frame'),
            consoleOut: document.getElementById('console-output'), loader: document.getElementById('loader'),
            runBtn: document.getElementById('run-btn'), projTitle: document.getElementById('current-project-title')
        };

        // --- UI CONTROLLER ---
        const UI = {
            init: () => {
                lucide.createIcons();
                UI.setupEditor(); UI.setupSplitter();
                
                document.getElementById('auto-run-toggle').addEventListener('change', (e) => {
                    State.autoRun = e.target.checked; Els.runBtn.disabled = State.autoRun;
                    Els.runBtn.className = State.autoRun ? "flex items-center gap-1.5 text-xs font-bold transition-all text-dark-muted opacity-50 cursor-not-allowed uppercase tracking-wider" : "flex items-center gap-1.5 text-xs font-bold transition-all text-brand-400 hover:text-white bg-brand-500/20 px-3 py-1.5 rounded-xl border border-brand-500/30 uppercase tracking-wider shadow-glow";
                    if(State.autoRun) Engine.run();
                });
                Els.runBtn.addEventListener('click', () => { if(!State.autoRun) Engine.run(); });
                window.addEventListener('message', Engine.handleMessage);
            },
            
            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = msg;
                const iconWrap = document.getElementById('toast-icon-wrapper');
                
                if (type === 'error') {
                    iconWrap.className = 'p-1.5 rounded-lg bg-red-500/20 text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.2)]';
                    document.getElementById('toast-icon').setAttribute('data-lucide', 'alert-circle');
                } else {
                    iconWrap.className = 'p-1.5 rounded-lg bg-brand-500/20 text-brand-400 shadow-glow';
                    document.getElementById('toast-icon').setAttribute('data-lucide', 'check');
                }
                lucide.createIcons();
                
                toast.classList.add('toast-active'); toast.classList.remove('toast-enter');
                setTimeout(() => { toast.classList.remove('toast-active'); toast.classList.add('toast-enter'); }, 3000);
            },

            render: () => {
                UI.renderFiles(); UI.renderTabs();
                const active = State.files.find(f => f.id === State.activeFileId);
                if (active) {
                    if (Els.editor.value !== active.content) Els.editor.value = active.content;
                    Els.codePre.innerHTML = Highlighter.highlight(active.content, active.language);
                } else { Els.editor.value = ''; Els.codePre.innerHTML = ''; }
                UI.updateLines(); lucide.createIcons();
            },

            getIcon: (name) => {
                if (name.endsWith('.html')) return '<i data-lucide="file-code-2" class="w-4 h-4 text-[#ff7b72]"></i>';
                if (name.endsWith('.css')) return '<i data-lucide="palette" class="w-4 h-4 text-[#79c0ff]"></i>';
                if (name.endsWith('.js')) return '<i data-lucide="file-json" class="w-4 h-4 text-[#d2a8ff]"></i>';
                return '<i data-lucide="file-text" class="w-4 h-4 text-gray-400"></i>';
            },

            renderFiles: () => {
                Els.fileList.innerHTML = State.files.map(f => `
                    <div onclick="Workspace.setActive('${f.id}')" class="flex justify-between items-center px-3 py-2.5 rounded-xl cursor-pointer text-[13px] group transition-all ${State.activeFileId === f.id ? 'bg-brand-500/15 text-white font-semibold border border-brand-500/30 shadow-inner' : 'hover:bg-white/5 text-dark-muted hover:text-white border border-transparent'}">
                        <div class="flex items-center gap-2.5 overflow-hidden">${UI.getIcon(f.name)}<span class="truncate">${f.name}</span></div>
                        <button onclick="Workspace.deleteFile(event, '${f.id}')" class="opacity-0 group-hover:opacity-100 hover:text-red-400 p-1 transition-all"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                    </div>
                `).join('');
            },

            renderTabs: () => {
                Els.tabs.innerHTML = State.files.map(f => `
                    <div onclick="Workspace.setActive('${f.id}')" class="flex items-center px-4 py-2.5 cursor-pointer border-r border-dark-border text-[13px] whitespace-nowrap min-w-fit transition-all relative rounded-t-lg mt-1 ml-1 ${State.activeFileId === f.id ? 'bg-[#050508] text-white font-semibold' : 'bg-transparent hover:bg-white/5 text-dark-muted'}">
                        ${State.activeFileId === f.id ? '<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-brand-400 to-brand-600 rounded-t-lg shadow-glow"></div>' : ''}
                        <span class="mr-2.5">${UI.getIcon(f.name)}</span>
                        <span ondblclick="Workspace.renameFile(event, '${f.id}')" class="select-none">${f.name}</span>
                        <div class="w-5 ml-4 flex justify-center"><button onclick="Workspace.deleteFile(event, '${f.id}')" class="opacity-0 hover:opacity-100 text-dark-muted hover:text-red-400 transition-all ${State.activeFileId === f.id ? 'opacity-50' : ''}"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>
                    </div>
                `).join('');
            },

            updateLines: () => {
                const lines = Els.editor.value.split('\n').length;
                Els.lines.innerHTML = Array.from({ length: lines || 1 }).map((_, i) => `<div>${i + 1}</div>`).join('');
            },

            setupEditor: () => {
                Els.editor.addEventListener('input', (e) => {
                    const f = State.files.find(x => x.id === State.activeFileId);
                    if(f) {
                        f.content = e.target.value;
                        Els.codePre.innerHTML = Highlighter.highlight(f.content, f.language);
                        UI.updateLines(); Workspace.save();
                        if (State.autoRun) { clearTimeout(State.runTimer); Els.loader.style.display = 'block'; State.runTimer = setTimeout(Engine.run, 800); }
                    }
                });

                Els.editor.addEventListener('scroll', () => { 
                    Els.lines.scrollTop = Els.editor.scrollTop; 
                    Els.pre.scrollTop = Els.editor.scrollTop; Els.pre.scrollLeft = Els.editor.scrollLeft;
                });

                Els.editor.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault(); const s = Els.editor.selectionStart;
                        Els.editor.value = Els.editor.value.substring(0, s) + "  " + Els.editor.value.substring(Els.editor.selectionEnd);
                        Els.editor.selectionStart = Els.editor.selectionEnd = s + 2;
                        Els.editor.dispatchEvent(new Event('input'));
                    }
                    const p = { '(': ')', '{': '}', '[': ']', '"': '"', "'": "'" };
                    if (p[e.key]) {
                        e.preventDefault(); const s = Els.editor.selectionStart;
                        Els.editor.value = Els.editor.value.substring(0, s) + e.key + p[e.key] + Els.editor.value.substring(Els.editor.selectionEnd);
                        Els.editor.selectionStart = Els.editor.selectionEnd = s + 1;
                        Els.editor.dispatchEvent(new Event('input'));
                    }
                });
            },

            setupSplitter: () => {
                let drag = false; const resizer = document.getElementById('resizer');
                const es = document.getElementById('editor-section'); const ps = document.getElementById('preview-section');
                
                resizer.addEventListener('mousedown', () => { drag = true; resizer.classList.add('dragging'); document.body.style.cursor = 'col-resize'; Els.iframe.style.pointerEvents = 'none'; });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    const w = document.getElementById('workspace-container').getBoundingClientRect();
                    let nw = ((e.clientX - w.left) / w.width) * 100;
                    if (nw < 20) nw = 20; if (nw > 80) nw = 80;
                    es.style.width = `${nw}%`; ps.style.width = `${100 - nw}%`;
                });
                document.addEventListener('mouseup', () => { if (drag) { drag = false; resizer.classList.remove('dragging'); document.body.style.cursor = 'default'; Els.iframe.style.pointerEvents = 'auto'; } });
            },

            setViewMode: (m) => {
                ['btn-view-editor', 'btn-view-split', 'btn-view-preview'].forEach(id => document.getElementById(id).className = "p-1.5 rounded-lg text-dark-muted hover:text-white hover:bg-white/5 transition-all");
                document.getElementById(`btn-view-${m}`).className = "p-1.5 rounded-lg bg-dark-surface border border-dark-border text-brand-400 shadow-glow transition-all";
                
                const es = document.getElementById('editor-section'); const ps = document.getElementById('preview-section'); const r = document.getElementById('resizer');
                
                if (window.innerWidth < 768) {
                    es.style.display = (m === 'editor' || m === 'split') ? 'flex' : 'none';
                    ps.style.display = (m === 'preview') ? 'flex' : 'none';
                    if(m === 'split') { ps.style.display = 'none'; UI.showToast("Split not available on mobile","error"); }
                    es.style.width = '100%'; ps.style.width = '100%'; r.style.display = 'none';
                } else {
                    es.style.display = (m === 'split' || m === 'editor') ? 'flex' : 'none';
                    ps.style.display = (m === 'split' || m === 'preview') ? 'flex' : 'none';
                    r.style.display = m === 'split' ? 'flex' : 'none';
                    if(m === 'split') { es.style.width = '50%'; ps.style.width = '50%'; } else { es.style.width = '100%'; ps.style.width = '100%'; }
                }
            },

            toggleProjectModal: () => {
                const m = document.getElementById('project-modal');
                if (m.classList.contains('hidden')) {
                    Workspace.renderList(); m.classList.remove('hidden');
                    requestAnimationFrame(() => { m.classList.remove('opacity-0'); document.getElementById('project-modal-content').classList.remove('scale-95'); });
                } else {
                    m.classList.add('opacity-0'); document.getElementById('project-modal-content').classList.add('scale-95');
                    setTimeout(() => m.classList.add('hidden'), 300);
                }
            }
        };

        // --- DATA LAYER ---
        const Workspace = {
            init: () => {
                try {
                    const s = localStorage.getItem('nova_ide_data');
                    if (s) { State.projects = JSON.parse(s); State.currentProjId = localStorage.getItem('nova_active_proj') || Object.keys(State.projects)[0]; }
                } catch (e) {}

                if (!State.projects || Object.keys(State.projects).length === 0) {
                    const id = 'proj_' + Date.now();
                    State.projects = { [id]: { id, name: 'Welcome to Nova', files: Templates.nova, updated: Date.now() } };
                    State.currentProjId = id; Workspace.save();
                }
                Workspace.loadActive();
            },

            save: () => {
                try {
                    if (State.currentProjId && State.projects[State.currentProjId]) {
                        State.projects[State.currentProjId].files = State.files;
                        State.projects[State.currentProjId].updated = Date.now();
                    }
                    localStorage.setItem('nova_ide_data', JSON.stringify(State.projects));
                    localStorage.setItem('nova_active_proj', State.currentProjId);
                } catch (e) { UI.showToast("Storage quota exceeded", "error"); }
            },

            loadActive: () => {
                const p = State.projects[State.currentProjId];
                if (!p) return;
                State.files = p.files || []; State.activeFileId = State.files.length > 0 ? State.files[0].id : null;
                Els.projTitle.innerText = p.name;
                UI.render(); Engine.run();
            },

            setActive: (id) => { State.activeFileId = id; UI.render(); },

            createFile: async () => {
                const name = await Dialog.prompt("New File", "Enter file name (e.g. app.js):", "new_file.html");
                if (name && name.trim()) {
                    const ext = name.split('.').pop().toLowerCase();
                    const f = { id: Date.now().toString(), name: name.trim(), language: ext === 'js' ? 'javascript' : ext, content: '' };
                    State.files.push(f); State.activeFileId = f.id; Workspace.save(); UI.render(); UI.showToast("File created");
                }
            },

            renameFile: async (e, id) => {
                e.stopPropagation(); const f = State.files.find(x => x.id === id);
                const name = await Dialog.prompt("Rename File", "Enter new name:", f.name);
                if (name && name.trim()) { 
                    f.name = name.trim(); 
                    f.language = f.name.split('.').pop().toLowerCase() === 'js' ? 'javascript' : f.name.split('.').pop().toLowerCase();
                    Workspace.save(); UI.render(); 
                }
            },

            deleteFile: async (e, id) => {
                e.stopPropagation();
                if (State.files.length <= 1) return Dialog.alert("Access Denied", "Cannot delete the last file in the workspace.");
                const f = State.files.find(x => x.id === id);
                if (await Dialog.confirm("Delete File", `Remove ${f.name} permanently?`)) {
                    State.files = State.files.filter(x => x.id !== id);
                    if (State.activeFileId === id) State.activeFileId = State.files[0].id;
                    Workspace.save(); UI.render();
                }
            },

            renderList: () => {
                const sorted = Object.values(State.projects).sort((a,b) => b.updated - a.updated);
                document.getElementById('project-list').innerHTML = sorted.map(p => {
                    const active = p.id === State.currentProjId;
                    return `
                    <div class="relative flex flex-col p-4 rounded-2xl transition-all border ${active ? 'bg-brand-500/10 border-brand-500/30 shadow-[inset_0_0_20px_rgba(99,102,241,0.05)]' : 'bg-dark-surface border-dark-border hover:border-white/10 hover:bg-white/5'}">
                        <div class="flex items-start justify-between cursor-pointer" onclick="Workspace.switchProj('${p.id}')">
                            <div class="flex items-center gap-3">
                                <div class="p-2.5 rounded-xl bg-[#000]/50 text-brand-400 border border-dark-border shadow-inner"><i data-lucide="${active ? 'folder-open' : 'folder'}" class="w-5 h-5"></i></div>
                                <div>
                                    <h3 class="text-white text-[15px] font-bold flex items-center gap-2">${p.name} ${active ? '<span class="px-2 py-0.5 rounded-md text-[9px] bg-brand-500 text-white uppercase font-bold shadow-glow">Active</span>' : ''}</h3>
                                    <p class="text-xs text-dark-muted mt-1">${p.files.length} files • Updated ${new Date(p.updated).toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                        <div class="absolute top-4 right-4 flex gap-1">
                            <button onclick="Workspace.renameProj('${p.id}')" class="p-2 text-dark-muted hover:text-white hover:bg-white/10 rounded-lg transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            <button onclick="Workspace.deleteProj('${p.id}')" class="p-2 text-dark-muted hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
                }).join('');
                lucide.createIcons();
            },

            createProject: () => {
                const input = document.getElementById('new-project-name');
                const name = input.value.trim() || 'Untitled Workspace';
                const id = 'proj_' + Date.now();
                State.projects[id] = { id, name, files: [{id:'1',name:'index.html',language:'html',content:'<h1>New Workspace</h1>'}], updated: Date.now() };
                input.value = ''; Workspace.save(); Workspace.switchProj(id); UI.showToast("Workspace created");
            },

            switchProj: (id) => {
                if (id === State.currentProjId) return UI.toggleProjectModal();
                Workspace.save(); State.currentProjId = id; Workspace.loadActive(); Workspace.save(); UI.toggleProjectModal();
            },

            renameProj: async (id) => {
                const name = await Dialog.prompt("Rename Workspace", "Enter new name:", State.projects[id].name);
                if (name && name.trim()) { State.projects[id].name = name.trim(); Workspace.save(); Workspace.renderList(); if(State.currentProjId === id) Els.projTitle.innerText = name.trim(); }
            },

            deleteProj: async (id) => {
                if (Object.keys(State.projects).length <= 1) return Dialog.alert("Action Denied", "Cannot delete your only workspace.");
                if (await Dialog.confirm("Delete Workspace", `Delete "${State.projects[id].name}" permanently?`)) {
                    delete State.projects[id];
                    if (State.currentProjId === id) { State.currentProjId = Object.keys(State.projects)[0]; Workspace.loadActive(); }
                    Workspace.save(); Workspace.renderList(); UI.showToast("Workspace deleted");
                }
            },

            copyContent: async () => { try { await navigator.clipboard.writeText(Els.editor.value); UI.showToast("Copied code"); } catch(e){ UI.showToast("Copy failed", "error"); } },
            
            exportProject: () => {
                if(!State.blobUrl) return UI.showToast("Build required", "error");
                fetch(State.blobUrl).then(r => r.blob()).then(b => {
                    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
                    a.download = `${State.projects[State.currentProjId].name.replace(/\s+/g,'-')}.html`;
                    a.click(); URL.revokeObjectURL(a.href); UI.showToast("Exported as HTML");
                });
            },
            
            openNewTab: () => { if(State.blobUrl) window.open(State.blobUrl, '_blank'); else UI.showToast("Build required", "error"); }
        };

        // --- COMPILER ENGINE ---
        const Engine = {
            getDoc: () => {
                const html = State.files.find(f => f.name === 'index.html')?.content || State.files.filter(f=>f.name.endsWith('.html'))[0]?.content || '';
                const css = State.files.filter(f => f.name.endsWith('.css')).map(f => f.content).join('\n');
                const js = State.files.filter(f => f.name.endsWith('.js')).map(f => f.content).join('\n');
                return `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<style>${css}</style>\n<script>\nwindow.onerror=function(m,u,l){window.parent.postMessage({src:'nova',type:'error',msg:m+' (Line: '+l+')'},'*');return false;};\nconst ol=console.log,ow=console.warn,oe=console.error,oi=console.info;\nfunction fmt(a){return Array.from(a).map(x=>{if(typeof x==='object'){try{return JSON.stringify(x,null,2)}catch(e){return String(x)}}return String(x)}).join(' ')}\nconsole.log=function(...a){window.parent.postMessage({src:'nova',type:'log',msg:fmt(a)},'*');ol.apply(console,a)};\nconsole.warn=function(...a){window.parent.postMessage({src:'nova',type:'warn',msg:fmt(a)},'*');ow.apply(console,a)};\nconsole.error=function(...a){window.parent.postMessage({src:'nova',type:'error',msg:fmt(a)},'*');oe.apply(console,a)};\nconsole.info=function(...a){window.parent.postMessage({src:'nova',type:'info',msg:fmt(a)},'*');oi.apply(console,a)};\n<\/script>\n</head>\n<body>\n${html}\n<script>${js}<\/script>\n</body>\n</html>`;
            },
            run: () => {
                Els.loader.style.display = 'block'; Engine.clearConsole();
                const blob = new Blob([Engine.getDoc()], { type: 'text/html' });
                if (State.blobUrl) URL.revokeObjectURL(State.blobUrl);
                State.blobUrl = URL.createObjectURL(blob);
                Els.iframe.src = State.blobUrl;
                setTimeout(() => { Els.loader.style.display = 'none'; if(!State.autoRun) UI.showToast("Build successful"); }, 300);
            },
            handleMessage: (e) => {
                if (e.data && e.data.src === 'nova') {
                    State.consoleLogs.push({ type: e.data.type, msg: e.data.msg, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) });
                    Engine.renderConsole();
                }
            },
            renderConsole: () => {
                if (!State.consoleLogs.length) { Els.consoleOut.innerHTML = '<div class="text-dark-muted italic opacity-50 text-center mt-4">Waiting for console output...</div>'; return; }
                Els.consoleOut.innerHTML = State.consoleLogs.map(l => {
                    let st = 'text-gray-300', ic = '<i data-lucide="chevron-right" class="w-3 h-3 text-gray-500 mt-0.5"></i>', bg = 'hover:bg-white/5 px-2 py-1.5 rounded-lg';
                    if(l.type==='error'){ st='text-red-400'; ic='<i data-lucide="x-circle" class="w-3.5 h-3.5 text-red-500 mt-0.5"></i>'; bg='bg-red-500/10 px-2 py-1.5 rounded-lg border border-red-500/20'; }
                    if(l.type==='warn'){ st='text-yellow-400'; ic='<i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-yellow-500 mt-0.5"></i>'; bg='bg-yellow-500/10 px-2 py-1.5 rounded-lg border border-yellow-500/20'; }
                    if(l.type==='info'){ st='text-blue-400'; ic='<i data-lucide="info" class="w-3.5 h-3.5 text-blue-500 mt-0.5"></i>'; }
                    const msg = l.msg.includes('\n') ? `<pre class="mt-1 font-mono text-[11px] bg-black/50 p-2.5 rounded-lg border border-white/5 overflow-x-auto shadow-inner">${l.msg}</pre>` : `<span>${l.msg}</span>`;
                    return `<div class="flex gap-2 items-start ${bg} break-words transition-colors">${ic}<div class="flex-1 min-w-0 ${st}">${msg}</div><span class="opacity-30 text-[9px] mt-1 whitespace-nowrap font-medium">${l.time}</span></div>`;
                }).join('');
                lucide.createIcons(); Els.consoleOut.scrollTop = Els.consoleOut.scrollHeight;
            },
            clearConsole: () => { State.consoleLogs = []; Engine.renderConsole(); }
        };

        // --- GLOBAL HELPERS ---
        function toggleMobileSidebar() {
            const s = document.getElementById('sidebar'); const o = document.getElementById('sidebar-overlay');
            if (s.classList.contains('-translate-x-full')) {
                s.classList.remove('-translate-x-full'); o.classList.remove('hidden'); requestAnimationFrame(()=>o.classList.remove('opacity-0'));
            } else {
                s.classList.add('-translate-x-full'); o.classList.add('opacity-0'); setTimeout(()=>o.classList.add('hidden'), 300);
            }
        }
        function setTheme(t) {
            document.documentElement.className = `dark theme-${t}`; State.theme = t;
            UI.showToast(`${t.charAt(0).toUpperCase()+t.slice(1)} theme active`);
        }

        // Boot
        UI.init(); Workspace.init();
    </script>
</body>
</html>
